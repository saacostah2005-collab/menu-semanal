<!-- Aplica el tema guardado antes de pintar (evita el parpadeo claro/oscuro) -->
<script>
(function(){
  try{
    var t = localStorage.getItem('menuSemanalTheme');
    if(!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<link rel="preload" as="image" href="banner.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Paleta tomada del banner: verde bosque, verde hoja, tomate y pimiento */
  :root{
    --bg:#F3F6F0;
    --surface:#FFFFFF;
    --surface-2:#EEF3EA;
    --ink:#17251C;
    --ink-2:#4F5E54;
    --ink-3:#85928A;
    --line:#E0E8DA;
    --line-strong:#CCD8C5;

    --brand:#1E5B3A;
    --brand-hover:#174A2F;
    --brand-deep:#123D27;
    --brand-ink:#FFFFFF;
    --brand-soft:#E4F0E6;
    --leaf:#6AB04C;
    --leaf-soft:#EAF5E1;

    --c-desayuno:#DB8E17;  --t-desayuno:#FDF0D9;
    --c-media:#5E9F43;     --t-media:#E8F4DF;
    --c-almuerzo:#D44E2C;  --t-almuerzo:#FCE7E0;
    --c-cena:#46699B;      --t-cena:#E4EBF5;

    --r-lg:20px;
    --r:14px;
    --r-sm:10px;
    --shadow-sm:0 1px 2px rgba(18,61,39,.05);
    --shadow:0 1px 2px rgba(18,61,39,.05), 0 10px 28px -10px rgba(18,61,39,.16);

    --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#0C1711;
    --surface:#12211A;
    --surface-2:#182B21;
    --ink:#E8F0E6;
    --ink-2:#A8B8AC;
    --ink-3:#718276;
    --line:#1F3328;
    --line-strong:#2A4234;

    --brand:#2E7A4F;
    --brand-hover:#38895B;
    --brand-deep:#0F2E1E;
    --brand-ink:#FFFFFF;
    --brand-soft:#163323;
    --leaf:#8BCB5F;
    --leaf-soft:#1A2E1C;

    --c-desayuno:#F0B54D;  --t-desayuno:#2E2513;
    --c-media:#8BCB5F;     --t-media:#1B2C17;
    --c-almuerzo:#EE7C5C;  --t-almuerzo:#33201A;
    --c-cena:#86A7D6;      --t-cena:#1A2433;

    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%; color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 18px;}
  @media (min-width:768px){ .wrap{padding:0 32px;} }
  button{font:inherit; color:inherit; touch-action:manipulation;}
  :focus-visible{outline:2.5px solid var(--leaf); outline-offset:2px; border-radius:10px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  .ico{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  /* ---------- Banner ---------- */
  .hero{
    position:relative; overflow:hidden;
    height:clamp(230px, 27vw, 440px);
    background:#123D27;
    color:#fff;
  }
  .hero-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:left top; display:block;
  }
  .hero::after{
    content:""; position:absolute; inset:auto 0 0 0; height:45%;
    background:linear-gradient(to top, rgba(10,36,22,.45), rgba(10,36,22,0));
    pointer-events:none;
  }
  .hero-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:1;
    padding-bottom:18px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
  }
  @media (min-width:768px){ .hero-bar{padding-bottom:26px;} }
  .hero-chip{
    display:inline-flex; align-items:center; gap:10px; min-width:0;
    background:rgba(8,30,18,.42); border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    padding:8px 14px 8px 10px; border-radius:14px;
  }
  .hero-chip .chip-ico{width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.14); display:grid; place-items:center; flex:none;}
  .hero-chip .ico{width:18px; height:18px; color:#B9E58F;}
  .hero-chip .chip-text{display:flex; flex-direction:column; min-width:0; line-height:1.25;}
  .hero-chip strong{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hero-chip span{font-size:12.5px; color:rgba(255,255,255,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hero-actions{display:flex; gap:8px; flex:none;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 18px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; text-decoration:none;
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s var(--ease-out);
  }
  .btn:active:not(:disabled){transform:scale(.96);}
  .btn .ico{width:18px; height:18px;}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink);}
  .btn.light{background:rgba(255,255,255,.95); border-color:transparent; color:#17251C; box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .btn.light .ico{color:#1E5B3A;}
  .btn.glass{background:rgba(8,30,18,.42); border-color:rgba(255,255,255,.22); color:#fff; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  .btn.icon{width:44px; padding:0;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  @media (hover:hover){
    .btn:hover:not(:disabled){background:var(--surface-2);}
    .btn.primary:hover:not(:disabled){background:var(--brand-hover); border-color:var(--brand-hover);}
    .btn.light:hover:not(:disabled){background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.22);}
    .btn.glass:hover:not(:disabled){background:rgba(8,30,18,.6);}
  }
  @media (max-width:479px){ .btn .label-long{display:none;} }

  /* ---------- Títulos de sección ---------- */
  .sec-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .sec-title{display:flex; align-items:center; gap:12px; min-width:0;}
  .sec-ico{width:44px; height:44px; border-radius:14px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; flex:none;}
  :root[data-theme="dark"] .sec-ico{color:var(--leaf);}
  .sec-ico .ico{width:22px; height:22px;}
  .sec-title h2{font-size:clamp(21px, 2.6vw, 26px); font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0;}
  .sec-title p{margin:2px 0 0; font-size:14px; color:var(--ink-2);}

  /* ---------- Hoy ---------- */
  .today{padding-top:28px;}
  @media (min-width:768px){ .today{padding-top:40px;} }

  .next{
    position:relative; overflow:hidden;
    background:linear-gradient(120deg, #123D27 0%, #1E5B3A 55%, #2D7448 100%);
    color:#fff; border-radius:var(--r-lg); padding:22px 22px 24px;
    display:flex; align-items:center; gap:18px; box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .next::after{
    content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(139,203,95,.28), rgba(139,203,95,0) 70%);
    pointer-events:none;
  }
  @media (min-width:768px){ .next{padding:28px 30px; gap:22px;} }
  .next-ico{width:58px; height:58px; border-radius:18px; background:rgba(255,255,255,.14); display:grid; place-items:center; flex:none;}
  .next-ico .ico{width:28px; height:28px; color:#B9E58F; stroke-width:1.9;}
  @media (min-width:768px){ .next-ico{width:68px; height:68px;} .next-ico .ico{width:32px; height:32px;} }
  .next-body{min-width:0; position:relative; z-index:1;}
  .next-label{font-size:13.5px; font-weight:700; color:#B9E58F; margin:0 0 4px;}
  .next h1{font-size:clamp(24px, 4.2vw, 38px); font-weight:800; line-height:1.12; letter-spacing:-.025em; margin:0; overflow-wrap:anywhere;}
  .next-sub{font-size:14.5px; color:rgba(255,255,255,.8); margin:6px 0 0;}

  .meal-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  @media (min-width:900px){ .meal-grid{grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px;} }
  .tile{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:16px; min-width:0; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:12px;
  }
  @media (min-width:768px){ .tile{padding:18px 18px 20px;} }
  .tile.is-next{border-color:var(--leaf); box-shadow:0 0 0 1px var(--leaf), var(--shadow);}
  .tile.is-past .tile-dish{color:var(--ink-2); font-weight:500;}
  .tile-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .tile-label{font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 2px;}
  .tile-dish{font-size:16px; font-weight:700; line-height:1.35; margin:0; overflow-wrap:anywhere;}
  .tile-dish.empty{color:var(--ink-3); font-weight:500;}

  .mi{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; background:var(--t); color:var(--c);}
  .mi .ico{width:20px; height:20px;}
  .mi.sm{width:30px; height:30px; border-radius:9px;}
  .mi.sm .ico{width:16px; height:16px;}
  .m-desayuno{--c:var(--c-desayuno); --t:var(--t-desayuno);}
  .m-media{--c:var(--c-media); --t:var(--t-media);}
  .m-almuerzo{--c:var(--c-almuerzo); --t:var(--t-almuerzo);}
  .m-cena{--c:var(--c-cena); --t:var(--t-cena);}

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; font-weight:700; line-height:1; padding:6px 10px; border-radius:999px;
    background:var(--leaf-soft); color:var(--brand); white-space:nowrap;
  }
  .badge .ico{width:13px; height:13px; stroke-width:2.4;}
  :root[data-theme="dark"] .badge{color:var(--leaf);}
  .badge.solid{background:var(--brand); color:#fff;}

  .empty-today{
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--r-lg);
    padding:22px; display:flex; align-items:center; gap:16px;
  }
  .empty-today h1{font-size:20px; font-weight:800; margin:0 0 2px; letter-spacing:-.01em;}
  .empty-today p{margin:0; color:var(--ink-2); font-size:14.5px;}

  /* ---------- Semana ---------- */
  .week{margin-top:48px;}
  @media (min-width:768px){ .week{margin-top:64px;} }

  .segmented{display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--surface); box-shadow:var(--shadow-sm);}
  .segmented button{
    height:40px; min-width:40px; padding:0 16px; border:0; border-radius:999px; background:transparent; cursor:pointer;
    font-size:14px; font-weight:700; display:grid; place-items:center;
    transition:background-color .15s ease, transform .12s var(--ease-out);
  }
  .segmented button.nav{padding:0;}
  .segmented button:active:not(:disabled){transform:scale(.94);}
  .segmented button:disabled{color:var(--ink-3); opacity:.55; cursor:not-allowed;}
  @media (hover:hover){ .segmented button:hover:not(:disabled){background:var(--surface-2);} }
  .segmented .ico{width:18px; height:18px;}
  #thisWeek.active{background:var(--brand); color:#fff;}

  .swap{animation:swap .28s var(--ease-out);}
  @keyframes swap{from{opacity:0; transform:translateY(6px);}}
  @media (prefers-reduced-motion:reduce){ .swap{animation:none;} }

  /* Tira de días (móvil y tablet) */
  .daystrip{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin-bottom:14px;}
  .daystrip button{
    height:64px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0;
    transition:background-color .15s ease, transform .12s var(--ease-out);
  }
  .daystrip button:active{transform:scale(.94);}
  .daystrip .ds-dow{font-size:12px; font-weight:600; color:var(--ink-3);}
  .daystrip .ds-num{font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.1;}
  .daystrip button.is-today{background:var(--brand); border-color:var(--brand); color:#fff;}
  .daystrip button.is-today .ds-dow{color:#B9E58F;}

  /* Tarjetas por día (móvil y tablet) */
  .days{display:grid; gap:12px;}
  @media (min-width:640px){ .days{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media (min-width:900px){ .days{grid-template-columns:repeat(3, minmax(0,1fr));} }
  .day{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:16px 18px 18px; scroll-margin-top:16px; min-width:0; box-shadow:var(--shadow-sm);
  }
  .day.is-today{border-color:var(--leaf); box-shadow:0 0 0 1px var(--leaf), var(--shadow);}
  .day-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--line);}
  .day-title{font-size:17px; font-weight:800; letter-spacing:-.01em; margin:0; line-height:1.2;}
  .day-date{font-size:13px; font-weight:500; color:var(--ink-3); margin-left:6px;}
  .day-meals{display:grid; gap:10px; margin:0;}
  .day-meal{display:grid; grid-template-columns:30px 1fr; gap:12px; align-items:center;}
  .day-meal dt{margin:0;}
  .day-meal dd{margin:0; min-width:0;}
  .dm-label{display:block; font-size:12px; font-weight:600; color:var(--ink-3); line-height:1.3;}
  .dm-dish{display:block; font-size:15px; font-weight:600; line-height:1.35; overflow-wrap:anywhere;}
  .dm-dish.empty{color:var(--ink-3); font-weight:500;}

  /* Tabla de la semana (escritorio) */
  .planner{
    display:none;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .planner-grid{display:grid;}
  .p-cell{padding:14px 14px; border-top:1px solid var(--line); min-width:0; font-size:14.5px; font-weight:600; line-height:1.4; overflow-wrap:break-word;}
  .p-cell + .p-cell{border-left:1px solid var(--line);}
  .p-cell.first{border-left:0;}
  .p-head{border-top:0; padding:16px 14px 14px; background:var(--surface-2);}
  .p-dow{font-size:13px; font-weight:600; color:var(--ink-2);}
  .p-num{font-size:24px; font-weight:800; line-height:1.1; letter-spacing:-.02em; margin-top:2px;}
  .p-label{display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:700; color:var(--ink-2);}
  .p-cell.is-today{background:var(--leaf-soft);}
  .p-head.is-today{background:var(--brand); color:#fff;}
  .p-head.is-today .p-dow{color:#B9E58F;}
  .p-cell .empty{color:var(--ink-3); font-weight:500;}

  @media (min-width:1180px){
    .planner{display:block;}
    .daystrip, .days{display:none;}
  }

  /* ---------- Estados ---------- */
  .state{
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--r-lg);
    padding:44px 24px; text-align:center; color:var(--ink-2);
  }
  .state .sec-ico{margin:0 auto 14px;}
  .state h3{color:var(--ink); font-size:19px; font-weight:800; margin:0 0 6px;}
  .state p{margin:0 auto; max-width:460px; font-size:14.5px;}
  .state code{font-size:13px; background:var(--surface-2); padding:1px 6px; border-radius:5px;}
  .skeleton{display:grid; gap:10px;}
  .skeleton div{height:56px; border-radius:var(--r); background:linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size:200% 100%; animation:shimmer 1.4s infinite linear;}
  .skeleton.sk-today div:first-child{height:104px; border-radius:var(--r-lg);}
  @keyframes shimmer{to{background-position:-200% 0;}}
  @media (prefers-reduced-motion:reduce){ .skeleton div{animation:none;} }

  /* ---------- Pie ---------- */
  .footer{
    margin-top:56px; padding:22px 0 40px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    font-size:13.5px; color:var(--ink-3);
  }
  .sync{display:inline-flex; align-items:center; gap:8px;}
  .sync .ico{width:16px; height:16px;}
  .sync.ok{color:var(--brand);}
  :root[data-theme="dark"] .sync.ok{color:var(--leaf);}
  .sync.err{color:var(--c-almuerzo);}
  .foot-brand{display:inline-flex; align-items:center; gap:6px;}
  .foot-brand .ico{width:16px; height:16px; color:var(--leaf);}
</style>
</head>
<body>

<script>
/* ============================================================
   CONFIGURACIÓN — enlace CSV publicado de tu Google Sheet
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-0io3KEPeid20oEtEDmNwBGnYJHTSOnVsq3V8wUEmOGeMSMe_nfazhJb4HbhOXOjJfQfqbSNlMKbl/pub?output=csv";

/* Enlace del Google Apps Script (Web App) que guarda el historial
   de listas de compras en la hoja "Historial_Compras". */
const HISTORIAL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbCbOFPrTG8yljjNXlSNPY0oR7YJOO0BKvyXfDy70Py8TJ3GJ2OAORbJh4_VFg9VG7/exec";

/* "hasta" = minuto del día hasta el que esa comida se considera la que toca */
const MEAL_COLUMNS = [
  { key: "Desayuno", label: "Desayuno",     cls: "m-desayuno", icon: "i-coffee",   hasta: 10*60 },
  { key: "Med/Mañ",  label: "Media mañana", cls: "m-media",    icon: "i-apple",    hasta: 12*60 + 30 },
  { key: "Almuerzo", label: "Almuerzo",     cls: "m-almuerzo", icon: "i-utensils", hasta: 16*60 },
  { key: "Cena",     label: "Cena",         cls: "m-cena",     icon: "i-moon",     hasta: 24*60 }
];

/* Nombres con tilde para mostrar, aunque la hoja los tenga sin tilde */
const DAY_NAMES = { lunes:"Lunes", martes:"Martes", miercoles:"Miércoles", jueves:"Jueves", viernes:"Viernes", sabado:"Sábado", domingo:"Domingo" };
const DAY_ABBR  = { lunes:"Lun", martes:"Mar", miercoles:"Mié", jueves:"Jue", viernes:"Vie", sabado:"Sáb", domingo:"Dom" };

let WEEKS = [];       // array de { monday: Date, days: [rowObj, ...] } ordenado por fecha
let CURRENT_INDEX = 0;
let TODAY_WEEK_INDEX = null;

const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- utilidades ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function normalize(s){
  return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

function parseFecha(str){
  const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
}

function isSameDay(a, b){
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function fmtRange(monday){
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const opts = { day:'numeric', month:'long' };
  return monday.toLocaleDateString('es-PE', opts) + ' – ' + sunday.toLocaleDateString('es-PE', opts) + ', ' + sunday.getFullYear();
}

function fmtShort(d){
  return d ? d.toLocaleDateString('es-PE', { day:'numeric', month:'short' }).replace('.', '') : '';
}

function displayDay(name){ return DAY_NAMES[normalize(name)] || name; }
function abbrDay(name){ return DAY_ABBR[normalize(name)] || name.slice(0,3); }

/* Un valor vacío o "Libre" se muestra atenuado */
function isEmptyValue(v){ return !v || normalize(v) === 'libre' || normalize(v) === 'sin definir'; }
function mealText(v){ return v ? v.replace(/\s*\+\s*/g, ' + ').replace(/\s*\/\s*/g, ' / ') : 'Sin definir'; }

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function icon(id){
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'ico');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(SVGNS, 'use');
  use.setAttribute('href', '#' + id);
  svg.appendChild(use);
  return svg;
}

/* Cuadrito de color con el icono de la comida */
function mealIcon(col, small){
  const s = el('span', 'mi ' + col.cls + (small ? ' sm' : ''));
  s.appendChild(icon(col.icon));
  return s;
}

function todayDate(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function replay(node){
  node.classList.remove('swap');
  void node.offsetWidth;
  node.classList.add('swap');
}

/* ---------- tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const label = theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  document.getElementById('themeLabel').textContent = label;
  document.getElementById('themeToggle').title = label;
  document.getElementById('themeIcon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  try{ localStorage.setItem('menuSemanalTheme', theme); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('menuSemanalTheme'); }catch(e){}
  const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (preferDark ? 'dark' : 'light'));
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* ---------- sección "Hoy" ---------- */
function renderToday(){
  const today = todayDate();
  let row = null;
  WEEKS.forEach(w => w.days.forEach(d => { if(d.fecha && isSameDay(d.fecha, today)) row = d; }));

  const box = document.getElementById('todayBox');
  box.innerHTML = '';
  // Fecha corta para que entre en el banner del celular ("Miércoles 18 nov")
  document.getElementById('heroDate').textContent =
    capitalize(today.toLocaleDateString('es-PE', { weekday:'long' })) + ' ' + fmtShort(today);

  if(!row){
    document.getElementById('heroSub').textContent = 'Sin menú para hoy';
    const empty = el('div', 'empty-today');
    const ic = el('span', 'sec-ico'); ic.appendChild(icon('i-calendar'));
    const txt = el('div');
    txt.appendChild(el('h1', '', 'Aún no hay menú para hoy'));
    txt.appendChild(el('p', '', 'Agrega este día en tu hoja de Google y aparecerá aquí.'));
    empty.append(ic, txt);
    box.appendChild(empty);
    return;
  }

  // La comida que toca según la hora; si está libre, la próxima que tenga plato
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  let slot = MEAL_COLUMNS.findIndex(c => minutes < c.hasta);
  if(slot < 0) slot = MEAL_COLUMNS.length - 1;
  let nextIdx = -1;
  for(let i = slot; i < MEAL_COLUMNS.length; i++){
    if(!isEmptyValue(row.values[MEAL_COLUMNS[i].key])){ nextIdx = i; break; }
  }

  const planned = MEAL_COLUMNS.filter(c => !isEmptyValue(row.values[c.key])).length;
  document.getElementById('heroSub').textContent = planned + (planned === 1 ? ' comida hoy' : ' comidas hoy');

  // Tarjeta verde: lo que toca ahora
  const next = el('div', 'next');
  const nIco = el('span', 'next-ico');
  const body = el('div', 'next-body');
  if(nextIdx >= 0){
    const col = MEAL_COLUMNS[nextIdx];
    nIco.appendChild(icon(col.icon));
    body.appendChild(el('p', 'next-label', (nextIdx === slot ? 'Ahora toca' : 'Lo siguiente') + ' · ' + col.label));
    body.appendChild(el('h1', '', mealText(row.values[col.key])));
  } else {
    nIco.appendChild(icon('i-smile'));
    body.appendChild(el('p', 'next-label', 'Hoy'));
    body.appendChild(el('h1', '', 'El resto del día está libre'));
    body.appendChild(el('p', 'next-sub', 'No hay más comidas planificadas.'));
  }
  next.append(nIco, body);
  box.appendChild(next);

  // Las cuatro comidas del día
  const grid = el('div', 'meal-grid');
  grid.setAttribute('role', 'list');
  grid.setAttribute('aria-label', 'Comidas de hoy');
  MEAL_COLUMNS.forEach((col, i) => {
    const v = row.values[col.key];
    const tile = el('div', 'tile' + (i === nextIdx ? ' is-next' : '') + (i < slot ? ' is-past' : ''));
    tile.setAttribute('role', 'listitem');
    const top = el('div', 'tile-top');
    top.appendChild(mealIcon(col));
    if(i === nextIdx){
      const b = el('span', 'badge');
      b.append(icon('i-clock'), nextIdx === slot ? 'Ahora' : 'Sigue');
      top.appendChild(b);
    }
    tile.appendChild(top);
    const txt = el('div');
    txt.appendChild(el('p', 'tile-label', col.label));
    txt.appendChild(el('p', 'tile-dish' + (isEmptyValue(v) ? ' empty' : ''), mealText(v)));
    tile.appendChild(txt);
    grid.appendChild(tile);
  });
  box.appendChild(grid);
}

/* ---------- tabla de la semana (escritorio) ---------- */
function buildPlanner(week, today){
  const planner = el('div', 'planner');
  const grid = el('div', 'planner-grid');
  grid.style.gridTemplateColumns = '170px repeat(' + week.days.length + ', minmax(0, 1fr))';

  grid.appendChild(el('div', 'p-cell p-head first'));
  week.days.forEach(d => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const h = el('div', 'p-cell p-head' + (isToday ? ' is-today' : ''));
    h.appendChild(el('div', 'p-dow', isToday ? 'Hoy · ' + abbrDay(d.nombreDia) : displayDay(d.nombreDia)));
    h.appendChild(el('div', 'p-num', d.fecha ? String(d.fecha.getDate()) : '–'));
    grid.appendChild(h);
  });

  MEAL_COLUMNS.forEach(col => {
    const label = el('div', 'p-cell p-label first');
    label.append(mealIcon(col, true), col.label);
    grid.appendChild(label);
    week.days.forEach(d => {
      const isToday = !!(d.fecha && isSameDay(d.fecha, today));
      const v = d.values[col.key];
      const c = el('div', 'p-cell' + (isToday ? ' is-today' : ''));
      c.appendChild(el('span', isEmptyValue(v) ? 'empty' : '', mealText(v)));
      grid.appendChild(c);
    });
  });

  planner.appendChild(grid);
  return planner;
}

/* ---------- tira de días + tarjetas (móvil / tablet) ---------- */
function buildDayStrip(week, today){
  const strip = el('nav', 'daystrip');
  strip.setAttribute('aria-label', 'Ir a un día');
  week.days.forEach((d, i) => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const b = el('button', isToday ? 'is-today' : '');
    b.type = 'button';
    b.setAttribute('aria-label', displayDay(d.nombreDia) + (d.fecha ? ' ' + fmtShort(d.fecha) : ''));
    b.appendChild(el('span', 'ds-dow', isToday ? 'Hoy' : abbrDay(d.nombreDia)));
    b.appendChild(el('span', 'ds-num', d.fecha ? String(d.fecha.getDate()) : '–'));
    b.addEventListener('click', () => {
      const target = document.getElementById('day-' + i);
      if(target) target.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block:'start' });
    });
    strip.appendChild(b);
  });
  return strip;
}

function buildDayList(week, today){
  const list = el('div', 'days');
  week.days.forEach((d, i) => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const art = el('article', 'day' + (isToday ? ' is-today' : ''));
    art.id = 'day-' + i;

    const head = el('div', 'day-head');
    const h3 = el('h3', 'day-title', displayDay(d.nombreDia));
    if(d.fecha) h3.appendChild(el('span', 'day-date', fmtShort(d.fecha)));
    head.appendChild(h3);
    if(isToday) head.appendChild(el('span', 'badge solid', 'Hoy'));
    art.appendChild(head);

    const dl = el('dl', 'day-meals');
    MEAL_COLUMNS.forEach(col => {
      if(d.values[col.key] === undefined) return;
      const v = d.values[col.key];
      const row = el('div', 'day-meal');
      const dt = el('dt');
      dt.appendChild(mealIcon(col, true));
      const dd = el('dd');
      dd.appendChild(el('span', 'dm-label', col.label));
      dd.appendChild(el('span', 'dm-dish' + (isEmptyValue(v) ? ' empty' : ''), mealText(v)));
      row.append(dt, dd);
      dl.appendChild(row);
    });
    art.appendChild(dl);
    list.appendChild(art);
  });
  return list;
}

/* ---------- título relativo de la semana ---------- */
function weekTitle(monday){
  const diff = Math.round((monday - getMonday(todayDate())) / (7 * 864e5));
  if(diff === 0) return 'Esta semana';
  if(diff === -1) return 'Semana pasada';
  if(diff === 1) return 'Próxima semana';
  return 'Semana del ' + monday.toLocaleDateString('es-PE', { day:'numeric', month:'long' });
}

/* ---------- render de la semana activa ---------- */
function renderWeek(animate){
  const app = document.getElementById('app');
  const week = WEEKS[CURRENT_INDEX];
  const today = todayDate();

  app.innerHTML = "";
  app.appendChild(buildPlanner(week, today));
  app.appendChild(buildDayStrip(week, today));
  app.appendChild(buildDayList(week, today));
  if(animate) replay(app);

  document.getElementById('weekTitle').textContent = weekTitle(week.monday);
  document.getElementById('weekRange').textContent = fmtRange(week.monday);

  document.getElementById('prevWeek').disabled = (CURRENT_INDEX === 0);
  document.getElementById('nextWeek').disabled = (CURRENT_INDEX === WEEKS.length - 1);

  const thisWeekBtn = document.getElementById('thisWeek');
  thisWeekBtn.disabled = (TODAY_WEEK_INDEX === null);
  thisWeekBtn.title = (TODAY_WEEK_INDEX === null) ? 'No hay menú para esta semana' : 'Ir a esta semana';
  thisWeekBtn.classList.toggle('active', CURRENT_INDEX === TODAY_WEEK_INDEX);
}

document.getElementById('prevWeek').addEventListener('click', function(){
  if(CURRENT_INDEX > 0){ CURRENT_INDEX--; renderWeek(true); }
});
document.getElementById('nextWeek').addEventListener('click', function(){
  if(CURRENT_INDEX < WEEKS.length - 1){ CURRENT_INDEX++; renderWeek(true); }
});
document.getElementById('thisWeek').addEventListener('click', function(){
  if(TODAY_WEEK_INDEX !== null && CURRENT_INDEX !== TODAY_WEEK_INDEX){ CURRENT_INDEX = TODAY_WEEK_INDEX; renderWeek(true); }
});

/* ---------- estados ---------- */
function setSync(text, state){
  document.getElementById('syncText').textContent = text;
  document.getElementById('sync').className = 'sync' + (state ? ' ' + state : '');
  document.getElementById('syncIcon').setAttribute('href', state === 'err' ? '#i-alert' : '#i-refresh');
}

function showError(message){
  setSync('No se pudo conectar con tu hoja de Google', 'err');
  document.getElementById('heroSub').textContent = 'No se pudo cargar el menú';
  document.getElementById('todayBox').innerHTML = '';
  document.getElementById('app').innerHTML =
    '<div class="state"><span class="sec-ico"><svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg></span>' +
    '<h3>No se pudo cargar el menú</h3><p>' + message + '</p></div>';
}

/* ---------- carga y agrupamiento por semana ---------- */
function render(rows){
  const header = rows[0].map(h => h.trim());
  const body = rows.slice(1);
  const idx = {};
  header.forEach((h, i) => idx[h] = i);

  if(idx['Fecha'] === undefined || idx['Nom_Dia'] === undefined){
    showError('No encuentro las columnas <code>Fecha</code> y <code>Nom_Dia</code> en la hoja. Revisa que los encabezados coincidan.');
    return;
  }

  const today = todayDate();
  const weekMap = new Map(); // key: monday ISO -> { monday, days: [] }

  body.forEach(r => {
    const fechaStr = (r[idx['Fecha']] || "").trim();
    const nombreDia = (r[idx['Nom_Dia']] || "").trim();
    if(!nombreDia) return;
    const fecha = parseFecha(fechaStr);

    const values = {};
    MEAL_COLUMNS.forEach(col => {
      if(idx[col.key] !== undefined) values[col.key] = (r[idx[col.key]] || "").trim();
    });

    const dayRow = { fecha, fechaStr, nombreDia, values };
    const monday = fecha ? getMonday(fecha) : getMonday(today);
    const key = monday.toISOString().slice(0,10);
    if(!weekMap.has(key)) weekMap.set(key, { monday, days: [] });
    weekMap.get(key).days.push(dayRow);
  });

  WEEKS = Array.from(weekMap.values()).sort((a,b) => a.monday - b.monday);
  WEEKS.forEach(w => w.days.sort((a,b) => (a.fecha||0) - (b.fecha||0)));

  if(!WEEKS.length){
    showError('La hoja no tiene filas de menú todavía.');
    return;
  }

  const todayMonday = getMonday(today).toISOString().slice(0,10);
  TODAY_WEEK_INDEX = null;
  WEEKS.forEach((w, i) => { if(w.monday.toISOString().slice(0,10) === todayMonday) TODAY_WEEK_INDEX = i; });

  if(TODAY_WEEK_INDEX !== null){
    CURRENT_INDEX = TODAY_WEEK_INDEX;
  } else {
    // semana más cercana a hoy
    let best = 0, bestDiff = Infinity;
    WEEKS.forEach((w, i) => {
      const diff = Math.abs(w.monday - today);
      if(diff < bestDiff){ bestDiff = diff; best = i; }
    });
    CURRENT_INDEX = best;
  }

  renderToday();
  renderWeek(false);
  const hora = new Date().toLocaleTimeString('es-PE', { hour:'numeric', minute:'2-digit' });
  setSync('Sincronizado con tu hoja de Google · ' + hora, 'ok');
}

function loadMenu(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('http') !== 0){
    showError('Todavía no configuraste el enlace de tu hoja. Abre este archivo, busca <code>SHEET_CSV_URL</code> y pega ahí el enlace CSV publicado de tu Google Sheet.');
    return;
  }
  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now())
    .then(res => {
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      if(!rows.length) throw new Error('vacío');
      render(rows);
    })
    .catch(err => {
      showError('Hubo un problema al conectar con la hoja (' + err.message + '). Verifica que esté publicada en la Web como CSV y que el enlace sea correcto.');
    });
}

loadMenu();

/* ============================================================
   LISTA DE COMPRAS — botón "Lista de compras" (abre en la misma pestaña)
   ============================================================ */
document.getElementById('btnAhorraTiempo').addEventListener('click', function(){
  const week = WEEKS[CURRENT_INDEX];
  // Sin menú cargado igual se abre la lista (usa la semana actual)
  if(!week){ window.location.href = 'lista-compras.html'; return; }

  const sunday = new Date(week.monday);
  sunday.setDate(sunday.getDate() + 6);

  const payload = {
    weekLabel: fmtRange(week.monday),
    monday: week.monday.toISOString().slice(0,10),
    sunday: sunday.toISOString().slice(0,10),
    days: week.days.map(d => ({
      nombreDia: d.nombreDia,
      fechaStr: d.fechaStr,
      desayuno: d.values['Desayuno'] || '',
      media: d.values['Med/Mañ'] || '',
      almuerzo: d.values['Almuerzo'] || '',
      cena: d.values['Cena'] || ''
    })),
    historialScriptUrl: HISTORIAL_SCRIPT_URL,
    generatedAt: new Date().toISOString()
  };

  try{
    localStorage.setItem('menuSmartShoppingWeek', JSON.stringify(payload));
  }catch(e){}

  window.location.href = 'lista-compras.html';
});
</script>
