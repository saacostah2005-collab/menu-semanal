<!-- Aplica el tema guardado antes de pintar (evita el parpadeo claro/oscuro) -->
<script>
(function(){
  try{
    var t = localStorage.getItem('menuSemanalTheme');
    if(!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --surface-2:#EFECE4;
    --ink:#1D1B16;
    --ink-2:#5E5A50;
    --ink-3:#8C877B;
    --line:#E5E1D7;
    --line-strong:#D4CFC2;

    --accent:#1F5C3F;
    --accent-hover:#174A32;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7EFE6;
    --accent-line:#BFD5C4;

    --c-desayuno:#B7791F;
    --c-media:#4E8A5E;
    --c-almuerzo:#B5523A;
    --c-cena:#4A6787;

    --r-lg:18px;
    --r:12px;
    --r-sm:10px;
    --shadow:0 1px 1px rgba(40,30,10,.03), 0 2px 6px rgba(40,30,10,.04), 0 12px 32px -12px rgba(40,30,10,.10);

    --serif:'Newsreader', ui-serif, Georgia, 'Times New Roman', serif;
    --sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#121311;
    --surface:#1A1B18;
    --surface-2:#22231F;
    --ink:#EEECE6;
    --ink-2:#AAA699;
    --ink-3:#7A776D;
    --line:#2A2B26;
    --line-strong:#383931;

    --accent:#6DBB8F;
    --accent-hover:#84CBA2;
    --accent-ink:#0C1A12;
    --accent-soft:#17241B;
    --accent-line:#2B4535;

    --c-desayuno:#E0A84A;
    --c-media:#72B887;
    --c-almuerzo:#E0846B;
    --c-cena:#8FA9C9;

    --shadow:0 1px 1px rgba(0,0,0,.25), 0 12px 32px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%; color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 max(20px, env(safe-area-inset-left,0px));}
  @media (min-width:768px){ .wrap{padding:0 36px;} }
  button{font:inherit; color:inherit; touch-action:manipulation;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  /* ---------- Barra superior ---------- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .topbar.scrolled{border-bottom-color:var(--line);}
  .topbar .wrap{height:64px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;}
  .brand-mark{
    width:32px; height:32px; border-radius:9px; background:var(--accent);
    display:grid; place-items:center; flex:none;
  }
  .brand-mark svg{width:17px; height:17px; stroke:var(--accent-ink); fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .brand-name{font-family:var(--serif); font-weight:500; font-size:21px; letter-spacing:-.01em;}
  .top-actions{display:flex; align-items:center; gap:8px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:42px; padding:0 16px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface);
    font-size:14.5px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; color:var(--ink);
    transition:background-color .15s ease, border-color .15s ease, transform .12s var(--ease-out);
  }
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.icon{width:42px; padding:0;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  @media (hover:hover){
    .btn:hover:not(:disabled){background:var(--surface-2);}
    .btn.primary:hover:not(:disabled){background:var(--accent-hover); border-color:var(--accent-hover);}
  }
  @media (max-width:479px){ .btn .label-long{display:none;} }

  /* ---------- Hoy ---------- */
  .today{padding:36px 0 0;}
  @media (min-width:768px){ .today{padding-top:56px;} }
  .today-layout{display:grid; gap:28px;}
  @media (min-width:1024px){ .today-layout{grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:64px; align-items:end;} }

  .kicker{font-size:14px; font-weight:500; color:var(--ink-2); margin:0 0 18px;}
  .next-label{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--accent); margin:0 0 10px;}
  .next-label::before{content:""; width:18px; height:1.5px; background:currentColor; border-radius:2px;}
  .today h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(38px, 6.4vw, 72px);
    line-height:1.02; letter-spacing:-.025em; margin:0; text-wrap:balance; overflow-wrap:anywhere;
  }
  .today h1 em{font-style:italic; color:var(--ink-2);}
  .today .lead{margin:16px 0 0; font-size:16px; color:var(--ink-2); max-width:46ch;}

  .meals{
    list-style:none; margin:0; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow);
  }
  .meal{
    display:grid; grid-template-columns:4px 1fr auto; gap:14px; align-items:center;
    padding:14px 14px; border-radius:var(--r); position:relative;
  }
  .meal + .meal::before{content:""; position:absolute; left:14px; right:14px; top:0; height:1px; background:var(--line);}
  .meal.is-next::before, .meal.is-next + .meal::before{display:none;}
  .meal.is-next{background:var(--accent-soft);}
  .meal-bar{width:4px; align-self:stretch; border-radius:4px; background:var(--dot, var(--ink-3)); opacity:.9;}
  .meal-body{min-width:0;}
  .meal-name{font-size:13px; font-weight:500; color:var(--ink-2); margin:0 0 2px;}
  .meal-dish{font-size:17px; font-weight:500; line-height:1.35; margin:0; overflow-wrap:anywhere;}
  .meal-dish.empty{color:var(--ink-3); font-weight:400;}
  .meal.is-past .meal-dish{color:var(--ink-2); font-weight:400;}
  .pill{
    font-size:12px; font-weight:600; line-height:1; padding:6px 9px; border-radius:999px;
    background:var(--accent); color:var(--accent-ink); white-space:nowrap;
  }

  .m-desayuno{--dot:var(--c-desayuno);}
  .m-media{--dot:var(--c-media);}
  .m-almuerzo{--dot:var(--c-almuerzo);}
  .m-cena{--dot:var(--c-cena);}

  /* ---------- Semana ---------- */
  .week{margin-top:64px; padding-top:40px; border-top:1px solid var(--line);}
  @media (min-width:768px){ .week{margin-top:88px; padding-top:48px;} }
  .week-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .week-head h2{font-family:var(--serif); font-weight:400; font-size:clamp(30px, 4vw, 40px); line-height:1.05; letter-spacing:-.02em; margin:0;}
  .week-head .range{font-size:15px; color:var(--ink-2); margin-top:6px;}

  .segmented{display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--surface);}
  .segmented button{
    height:38px; min-width:38px; padding:0 14px; border:0; border-radius:999px; background:transparent; cursor:pointer;
    font-size:14px; font-weight:500; display:grid; place-items:center;
    transition:background-color .15s ease, transform .12s var(--ease-out);
  }
  .segmented button.nav{padding:0;}
  .segmented button:active:not(:disabled){transform:scale(.94);}
  .segmented button:disabled{color:var(--ink-3); opacity:.6; cursor:not-allowed;}
  @media (hover:hover){ .segmented button:hover:not(:disabled){background:var(--surface-2);} }
  .segmented svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  #thisWeek.active{background:var(--ink); color:var(--bg);}

  .swap{animation:swap .28s var(--ease-out);}
  @keyframes swap{from{opacity:0; transform:translateY(6px);}}
  @media (prefers-reduced-motion:reduce){ .swap{animation:none;} }

  /* Tira de días (móvil y tablet) */
  .daystrip{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin-bottom:16px;}
  .daystrip button{
    height:62px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0;
    transition:background-color .15s ease, transform .12s var(--ease-out);
  }
  .daystrip button:active{transform:scale(.95);}
  .daystrip .ds-dow{font-size:12px; font-weight:500; color:var(--ink-3);}
  .daystrip .ds-num{font-size:19px; font-weight:600; letter-spacing:-.02em; line-height:1.1;}
  .daystrip button.is-today{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .daystrip button.is-today .ds-dow{color:inherit; opacity:.8;}

  /* Tarjetas por día (móvil y tablet) */
  .days{display:grid; gap:12px;}
  @media (min-width:640px){ .days{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media (min-width:900px){ .days{grid-template-columns:repeat(3, minmax(0,1fr));} }
  .day{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:18px 20px 20px; scroll-margin-top:84px; min-width:0;
  }
  .day.is-today{border-color:var(--accent-line); box-shadow:0 0 0 1px var(--accent-line), var(--shadow);}
  .day-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .day-title{font-family:var(--serif); font-size:24px; font-weight:400; letter-spacing:-.015em; margin:0; line-height:1.1;}
  .day-date{font-size:13.5px; color:var(--ink-3); margin-left:8px; font-family:var(--sans);}
  .day-meals{display:grid; gap:12px; margin:0;}
  .day-meal{display:grid; grid-template-columns:116px 1fr; gap:12px; align-items:baseline;}
  .day-meal dt{margin:0;}
  .day-meal dd{margin:0; font-size:15px; line-height:1.4; overflow-wrap:anywhere;}
  .day-meal dd.empty{color:var(--ink-3);}
  @media (max-width:339px){ .day-meal{grid-template-columns:1fr; gap:1px;} }

  .tag{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:var(--ink-2);}
  .tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--dot, var(--ink-3)); flex:none;}

  /* Tabla de la semana (escritorio) */
  .planner{
    display:none;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .planner-grid{display:grid;}
  .p-cell{padding:16px 16px; border-top:1px solid var(--line); min-width:0; font-size:14.5px; line-height:1.45; overflow-wrap:break-word; hyphens:auto;}
  .p-cell + .p-cell{border-left:1px solid var(--line);}
  .p-cell.first{border-left:0;}
  .p-head{border-top:0; padding:18px 16px 16px;}
  .p-dow{font-size:13px; font-weight:500; color:var(--ink-2); display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .p-num{font-family:var(--serif); font-size:30px; line-height:1; letter-spacing:-.02em; margin-top:6px;}
  .p-label{display:flex; align-items:flex-start;}
  .p-cell.is-today{background:var(--accent-soft);}
  .p-head.is-today .p-dow, .p-head.is-today .p-num{color:var(--accent);}
  .p-cell .empty{color:var(--ink-3);}
  .p-head .pill{padding:4px 8px; font-size:11.5px;}

  @media (min-width:1180px){
    .planner{display:block;}
    .daystrip, .days{display:none;}
  }

  /* ---------- Estados ---------- */
  .state{
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--r-lg);
    padding:48px 24px; text-align:center; color:var(--ink-2);
  }
  .state h3{font-family:var(--serif); color:var(--ink); font-size:24px; font-weight:400; margin:0 0 8px;}
  .state p{margin:0 auto; max-width:460px; font-size:15px;}
  .state code{font-size:13px; background:var(--surface-2); padding:1px 6px; border-radius:5px;}
  .skeleton{display:grid; gap:10px;}
  .skeleton div{height:52px; border-radius:var(--r); background:linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size:200% 100%; animation:shimmer 1.4s infinite linear;}
  .skeleton.sk-today div{height:62px;}
  @keyframes shimmer{to{background-position:-200% 0;}}
  @media (prefers-reduced-motion:reduce){ .skeleton div{animation:none;} }

  /* ---------- Pie ---------- */
  .footer{
    margin-top:64px; padding:22px 0 44px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    font-size:13.5px; color:var(--ink-3);
  }
  .sync{display:inline-flex; align-items:center; gap:8px;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3);}
  .sync .dot.ok{background:var(--accent);}
  .sync .dot.err{background:var(--c-almuerzo);}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 3v7a3 3 0 0 0 6 0V3"/><path d="M9 10v11"/><path d="M18 3c-1.5 1.5-2 3-2 6s.5 4.5 2 6"/><path d="M18 3v18"/></svg>
      </span>
      <span class="brand-name">Menu Smart</span>
    </a>
    <div class="top-actions">
      <button class="btn icon" id="themeToggle" type="button">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="sr-only" id="themeLabel">Modo oscuro</span>
      </button>
      <button class="btn primary" id="btnAhorraTiempo" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L20.5 8H6.1"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
        <span>Lista<span class="label-long"> de compras</span></span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="today" aria-labelledby="todayTitle">
    <div class="today-layout">
      <div>
        <p class="kicker" id="todayKicker">Hoy</p>
        <p class="next-label" id="nextLabel" hidden></p>
        <h1 id="todayTitle">Cargando tu menú…</h1>
        <p class="lead" id="todayLead" hidden></p>
      </div>
      <div id="todayMeals">
        <div class="skeleton sk-today" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
      </div>
    </div>
  </section>

  <section class="week" aria-labelledby="weekTitle">
    <div class="week-head">
      <div>
        <h2 id="weekTitle">Semana</h2>
        <div class="range" id="weekRange">&nbsp;</div>
      </div>
      <div class="segmented" role="group" aria-label="Cambiar de semana">
        <button class="nav" id="prevWeek" type="button" aria-label="Semana anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="thisWeek" type="button">Hoy</button>
        <button class="nav" id="nextWeek" type="button" aria-label="Semana siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div id="app">
      <div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
    </div>
  </section>

  <footer class="footer">
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Conectando con tu hoja de Google…</span></span>
    <span>Menu Smart · Planifica tus comidas, come mejor.</span>
  </footer>

</main>

<script>
/* ============================================================
   CONFIGURACIÓN — enlace CSV publicado de tu Google Sheet
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-0io3KEPeid20oEtEDmNwBGnYJHTSOnVsq3V8wUEmOGeMSMe_nfazhJb4HbhOXOjJfQfqbSNlMKbl/pub?output=csv";

/* Enlace del Google Apps Script (Web App) que guarda el historial
   de listas de compras en la hoja "Historial_Compras". */
const HISTORIAL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbCbOFPrTG8yljjNXlSNPY0oR7YJOO0BKvyXfDy70Py8TJ3GJ2OAORbJh4_VFg9VG7/exec";

/* "hasta" = minuto del día hasta el que esa comida se considera la siguiente */
const MEAL_COLUMNS = [
  { key: "Desayuno", label: "Desayuno",     cls: "m-desayuno", hasta: 10*60 },
  { key: "Med/Mañ",  label: "Media mañana", cls: "m-media",    hasta: 12*60 + 30 },
  { key: "Almuerzo", label: "Almuerzo",     cls: "m-almuerzo", hasta: 16*60 },
  { key: "Cena",     label: "Cena",         cls: "m-cena",     hasta: 24*60 }
];

/* Nombres con tilde para mostrar, aunque la hoja los tenga sin tilde */
const DAY_NAMES = { lunes:"Lunes", martes:"Martes", miercoles:"Miércoles", jueves:"Jueves", viernes:"Viernes", sabado:"Sábado", domingo:"Domingo" };
const DAY_ABBR  = { lunes:"Lun", martes:"Mar", miercoles:"Mié", jueves:"Jue", viernes:"Vie", sabado:"Sáb", domingo:"Dom" };

let WEEKS = [];       // array de { monday: Date, days: [rowObj, ...] } ordenado por fecha
let CURRENT_INDEX = 0;
let TODAY_WEEK_INDEX = null;

const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- utilidades ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function normalize(s){
  return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

function parseFecha(str){
  const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
}

function isSameDay(a, b){
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function fmtRange(monday){
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const opts = { day:'numeric', month:'long' };
  return monday.toLocaleDateString('es-PE', opts) + ' – ' + sunday.toLocaleDateString('es-PE', opts) + ', ' + sunday.getFullYear();
}

function fmtShort(d){
  return d ? d.toLocaleDateString('es-PE', { day:'numeric', month:'short' }).replace('.', '') : '';
}

function displayDay(name){ return DAY_NAMES[normalize(name)] || name; }
function abbrDay(name){ return DAY_ABBR[normalize(name)] || name.slice(0,3); }

/* Un valor vacío o "Libre" se muestra atenuado */
function isEmptyValue(v){ return !v || normalize(v) === 'libre' || normalize(v) === 'sin definir'; }
function mealText(v){ return v ? v.replace(/\s*\+\s*/g, ' + ').replace(/\s*\/\s*/g, ' / ') : 'Sin definir'; }

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function todayDate(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function replay(node){
  node.classList.remove('swap');
  void node.offsetWidth;
  node.classList.add('swap');
}

/* ---------- tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const label = theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  document.getElementById('themeLabel').textContent = label;
  document.getElementById('themeToggle').title = label;
  document.getElementById('themeIcon').innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  try{ localStorage.setItem('menuSemanalTheme', theme); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('menuSemanalTheme'); }catch(e){}
  const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (preferDark ? 'dark' : 'light'));
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* Borde de la barra solo cuando hay scroll */
(function(){
  const bar = document.getElementById('topbar');
  const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 4);
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
})();

/* ---------- sección "Hoy" ---------- */
function renderToday(){
  const today = todayDate();
  let row = null;
  WEEKS.forEach(w => w.days.forEach(d => { if(d.fecha && isSameDay(d.fecha, today)) row = d; }));

  const kicker = document.getElementById('todayKicker');
  const nextLabel = document.getElementById('nextLabel');
  const title = document.getElementById('todayTitle');
  const lead = document.getElementById('todayLead');
  const mealsBox = document.getElementById('todayMeals');
  mealsBox.innerHTML = '';
  nextLabel.hidden = true;
  lead.hidden = true;

  kicker.textContent = capitalize(today.toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long' }));

  if(!row){
    title.textContent = 'Aún no hay menú para hoy';
    lead.textContent = 'Agrega este día en tu hoja de Google y aparecerá aquí.';
    lead.hidden = false;
    return;
  }

  // La siguiente comida según la hora; si está libre, la próxima que tenga plato
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  let slot = MEAL_COLUMNS.findIndex(c => minutes < c.hasta);
  if(slot < 0) slot = MEAL_COLUMNS.length - 1;
  let nextIdx = -1;
  for(let i = slot; i < MEAL_COLUMNS.length; i++){
    if(!isEmptyValue(row.values[MEAL_COLUMNS[i].key])){ nextIdx = i; break; }
  }

  if(nextIdx >= 0){
    const col = MEAL_COLUMNS[nextIdx];
    nextLabel.textContent = (nextIdx === slot ? 'Ahora toca' : 'Siguiente') + ' · ' + col.label;
    nextLabel.hidden = false;
    title.textContent = mealText(row.values[col.key]);
  } else {
    title.innerHTML = '';
    title.append('El resto del día ');
    title.appendChild(el('em', '', 'está libre'));
  }

  const list = el('ol', 'meals');
  list.setAttribute('aria-label', 'Comidas de hoy');
  MEAL_COLUMNS.forEach((col, i) => {
    const v = row.values[col.key];
    const li = el('li', 'meal ' + col.cls + (i === nextIdx ? ' is-next' : '') + (i < slot ? ' is-past' : ''));
    li.appendChild(el('span', 'meal-bar'));
    const body = el('div', 'meal-body');
    body.appendChild(el('p', 'meal-name', col.label));
    body.appendChild(el('p', 'meal-dish' + (isEmptyValue(v) ? ' empty' : ''), mealText(v)));
    li.appendChild(body);
    if(i === nextIdx) li.appendChild(el('span', 'pill', nextIdx === slot ? 'Ahora' : 'Siguiente'));
    else li.appendChild(el('span'));
    list.appendChild(li);
  });
  mealsBox.appendChild(list);
}

/* ---------- tabla de la semana (escritorio) ---------- */
function buildPlanner(week, today){
  const planner = el('div', 'planner');
  const grid = el('div', 'planner-grid');
  grid.style.gridTemplateColumns = '148px repeat(' + week.days.length + ', minmax(0, 1fr))';

  grid.appendChild(el('div', 'p-cell p-head first'));
  week.days.forEach(d => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const h = el('div', 'p-cell p-head' + (isToday ? ' is-today' : ''));
    h.appendChild(el('div', 'p-dow', isToday ? 'Hoy' : displayDay(d.nombreDia)));
    h.appendChild(el('div', 'p-num', d.fecha ? String(d.fecha.getDate()) : '–'));
    grid.appendChild(h);
  });

  MEAL_COLUMNS.forEach(col => {
    const label = el('div', 'p-cell p-label first');
    label.appendChild(el('span', 'tag ' + col.cls, col.label));
    grid.appendChild(label);
    week.days.forEach(d => {
      const isToday = !!(d.fecha && isSameDay(d.fecha, today));
      const v = d.values[col.key];
      const c = el('div', 'p-cell' + (isToday ? ' is-today' : ''));
      c.appendChild(el('span', isEmptyValue(v) ? 'empty' : '', mealText(v)));
      grid.appendChild(c);
    });
  });

  planner.appendChild(grid);
  return planner;
}

/* ---------- tira de días + tarjetas (móvil / tablet) ---------- */
function buildDayStrip(week, today){
  const strip = el('nav', 'daystrip');
  strip.setAttribute('aria-label', 'Ir a un día');
  week.days.forEach((d, i) => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const b = el('button', isToday ? 'is-today' : '');
    b.type = 'button';
    b.setAttribute('aria-label', displayDay(d.nombreDia) + (d.fecha ? ' ' + fmtShort(d.fecha) : ''));
    b.appendChild(el('span', 'ds-dow', abbrDay(d.nombreDia)));
    b.appendChild(el('span', 'ds-num', d.fecha ? String(d.fecha.getDate()) : '–'));
    b.addEventListener('click', () => {
      const target = document.getElementById('day-' + i);
      if(target) target.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block:'start' });
    });
    strip.appendChild(b);
  });
  return strip;
}

function buildDayList(week, today){
  const list = el('div', 'days');
  week.days.forEach((d, i) => {
    const isToday = !!(d.fecha && isSameDay(d.fecha, today));
    const art = el('article', 'day' + (isToday ? ' is-today' : ''));
    art.id = 'day-' + i;

    const head = el('div', 'day-head');
    const h3 = el('h3', 'day-title', displayDay(d.nombreDia));
    if(d.fecha) h3.appendChild(el('span', 'day-date', fmtShort(d.fecha)));
    head.appendChild(h3);
    if(isToday) head.appendChild(el('span', 'pill', 'Hoy'));
    art.appendChild(head);

    const dl = el('dl', 'day-meals');
    MEAL_COLUMNS.forEach(col => {
      if(d.values[col.key] === undefined) return;
      const v = d.values[col.key];
      const row = el('div', 'day-meal');
      const dt = el('dt');
      dt.appendChild(el('span', 'tag ' + col.cls, col.label));
      row.appendChild(dt);
      row.appendChild(el('dd', isEmptyValue(v) ? 'empty' : '', mealText(v)));
      dl.appendChild(row);
    });
    art.appendChild(dl);
    list.appendChild(art);
  });
  return list;
}

/* ---------- título relativo de la semana ---------- */
function weekTitle(monday){
  const diff = Math.round((monday - getMonday(todayDate())) / (7 * 864e5));
  if(diff === 0) return 'Esta semana';
  if(diff === -1) return 'Semana pasada';
  if(diff === 1) return 'Próxima semana';
  return 'Semana del ' + monday.toLocaleDateString('es-PE', { day:'numeric', month:'long' });
}

/* ---------- render de la semana activa ---------- */
function renderWeek(animate){
  const app = document.getElementById('app');
  const week = WEEKS[CURRENT_INDEX];
  const today = todayDate();

  app.innerHTML = "";
  app.appendChild(buildPlanner(week, today));
  app.appendChild(buildDayStrip(week, today));
  app.appendChild(buildDayList(week, today));
  if(animate) replay(app);

  document.getElementById('weekTitle').textContent = weekTitle(week.monday);
  document.getElementById('weekRange').textContent = fmtRange(week.monday);

  document.getElementById('prevWeek').disabled = (CURRENT_INDEX === 0);
  document.getElementById('nextWeek').disabled = (CURRENT_INDEX === WEEKS.length - 1);

  const thisWeekBtn = document.getElementById('thisWeek');
  thisWeekBtn.disabled = (TODAY_WEEK_INDEX === null);
  thisWeekBtn.title = (TODAY_WEEK_INDEX === null) ? 'No hay menú para esta semana' : 'Ir a esta semana';
  thisWeekBtn.classList.toggle('active', CURRENT_INDEX === TODAY_WEEK_INDEX);
}

document.getElementById('prevWeek').addEventListener('click', function(){
  if(CURRENT_INDEX > 0){ CURRENT_INDEX--; renderWeek(true); }
});
document.getElementById('nextWeek').addEventListener('click', function(){
  if(CURRENT_INDEX < WEEKS.length - 1){ CURRENT_INDEX++; renderWeek(true); }
});
document.getElementById('thisWeek').addEventListener('click', function(){
  if(TODAY_WEEK_INDEX !== null && CURRENT_INDEX !== TODAY_WEEK_INDEX){ CURRENT_INDEX = TODAY_WEEK_INDEX; renderWeek(true); }
});

/* ---------- estados ---------- */
function setSync(text, state){
  document.getElementById('syncText').textContent = text;
  document.getElementById('syncDot').className = 'dot' + (state ? ' ' + state : '');
}

function showError(message){
  setSync('No se pudo conectar con tu hoja de Google', 'err');
  document.getElementById('todayTitle').textContent = 'No se pudo cargar el menú';
  document.getElementById('nextLabel').hidden = true;
  document.getElementById('todayLead').hidden = true;
  document.getElementById('todayMeals').innerHTML = '';
  document.getElementById('app').innerHTML =
    '<div class="state"><h3>No se pudo cargar el menú</h3><p>' + message + '</p></div>';
}

/* ---------- carga y agrupamiento por semana ---------- */
function render(rows){
  const header = rows[0].map(h => h.trim());
  const body = rows.slice(1);
  const idx = {};
  header.forEach((h, i) => idx[h] = i);

  if(idx['Fecha'] === undefined || idx['Nom_Dia'] === undefined){
    showError('No encuentro las columnas <code>Fecha</code> y <code>Nom_Dia</code> en la hoja. Revisa que los encabezados coincidan.');
    return;
  }

  const today = todayDate();
  const weekMap = new Map(); // key: monday ISO -> { monday, days: [] }

  body.forEach(r => {
    const fechaStr = (r[idx['Fecha']] || "").trim();
    const nombreDia = (r[idx['Nom_Dia']] || "").trim();
    if(!nombreDia) return;
    const fecha = parseFecha(fechaStr);

    const values = {};
    MEAL_COLUMNS.forEach(col => {
      if(idx[col.key] !== undefined) values[col.key] = (r[idx[col.key]] || "").trim();
    });

    const dayRow = { fecha, fechaStr, nombreDia, values };
    const monday = fecha ? getMonday(fecha) : getMonday(today);
    const key = monday.toISOString().slice(0,10);
    if(!weekMap.has(key)) weekMap.set(key, { monday, days: [] });
    weekMap.get(key).days.push(dayRow);
  });

  WEEKS = Array.from(weekMap.values()).sort((a,b) => a.monday - b.monday);
  WEEKS.forEach(w => w.days.sort((a,b) => (a.fecha||0) - (b.fecha||0)));

  if(!WEEKS.length){
    showError('La hoja no tiene filas de menú todavía.');
    return;
  }

  const todayMonday = getMonday(today).toISOString().slice(0,10);
  TODAY_WEEK_INDEX = null;
  WEEKS.forEach((w, i) => { if(w.monday.toISOString().slice(0,10) === todayMonday) TODAY_WEEK_INDEX = i; });

  if(TODAY_WEEK_INDEX !== null){
    CURRENT_INDEX = TODAY_WEEK_INDEX;
  } else {
    // semana más cercana a hoy
    let best = 0, bestDiff = Infinity;
    WEEKS.forEach((w, i) => {
      const diff = Math.abs(w.monday - today);
      if(diff < bestDiff){ bestDiff = diff; best = i; }
    });
    CURRENT_INDEX = best;
  }

  renderToday();
  renderWeek(false);
  const hora = new Date().toLocaleTimeString('es-PE', { hour:'numeric', minute:'2-digit' });
  setSync('Sincronizado con tu hoja de Google · ' + hora, 'ok');
}

function loadMenu(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('http') !== 0){
    showError('Todavía no configuraste el enlace de tu hoja. Abre este archivo, busca <code>SHEET_CSV_URL</code> y pega ahí el enlace CSV publicado de tu Google Sheet.');
    return;
  }
  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now())
    .then(res => {
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      if(!rows.length) throw new Error('vacío');
      render(rows);
    })
    .catch(err => {
      showError('Hubo un problema al conectar con la hoja (' + err.message + '). Verifica que esté publicada en la Web como CSV y que el enlace sea correcto.');
    });
}

loadMenu();

/* ============================================================
   LISTA DE COMPRAS — botón "Lista de compras" (abre pestaña nueva)
   ============================================================ */
document.getElementById('btnAhorraTiempo').addEventListener('click', function(){
  const week = WEEKS[CURRENT_INDEX];
  if(!week) return;

  const sunday = new Date(week.monday);
  sunday.setDate(sunday.getDate() + 6);

  const payload = {
    weekLabel: fmtRange(week.monday),
    monday: week.monday.toISOString().slice(0,10),
    sunday: sunday.toISOString().slice(0,10),
    days: week.days.map(d => ({
      nombreDia: d.nombreDia,
      fechaStr: d.fechaStr,
      desayuno: d.values['Desayuno'] || '',
      media: d.values['Med/Mañ'] || '',
      almuerzo: d.values['Almuerzo'] || '',
      cena: d.values['Cena'] || ''
    })),
    historialScriptUrl: HISTORIAL_SCRIPT_URL,
    generatedAt: new Date().toISOString()
  };

  try{
    localStorage.setItem('menuSmartShoppingWeek', JSON.stringify(payload));
  }catch(e){}

  window.open('lista-compras.html', '_blank');
});
