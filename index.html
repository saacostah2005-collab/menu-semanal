<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú de la semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF7EF;
    --paper: #FFFDF9;
    --ink: #2E2A24;
    --ink-soft: #6B6355;
    --line: #E4DCC9;
    --sage: #6E7A57;
    --sage-tint: #EDF0E5;
    --mustard: #C99A3A;
    --mustard-tint: #F7EDD9;
    --rust: #A6452E;
    --rust-tint: #F5E4DD;
    --dusk: #56677A;
    --dusk-tint: #E7ECF0;
    --shadow: 0 1px 2px rgba(46,42,36,0.04), 0 6px 16px rgba(46,42,36,0.05);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{
    max-width:660px;
    margin:0 auto;
    padding:36px 20px 64px;
  }

  /* ---- Header ---- */
  header{
    margin-bottom:30px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--rust);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:18px;height:18px;stroke:#fff;}
  .brand-name{
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:36px;
    line-height:1.08;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
  }
  .status{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--sage);
    flex:none;
  }
  .dot.err{background:var(--rust);}

  /* ---- Day card ---- */
  .day{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:16px;
    padding:20px 22px 22px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .day.today{
    border-color:rgba(166,69,46,0.35);
    box-shadow:0 1px 2px rgba(166,69,46,0.06), 0 10px 22px rgba(166,69,46,0.10);
  }
  .today-badge{
    display:none;
    position:absolute;
    top:16px; right:20px;
    background:var(--rust);
    color:#fff;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.07em;
    padding:4px 10px;
    border-radius:20px;
  }
  .day.today .today-badge{display:inline-block;}

  .day-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .day.today .day-head{border-color:rgba(166,69,46,0.2);}
  .day-badge{
    width:42px;height:42px;
    border-radius:11px;
    background:var(--sage-tint);
    color:var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    flex:none;
    text-transform:uppercase;
  }
  .day.today .day-badge{background:var(--rust);color:#fff;}
  .day-titles{display:flex;flex-direction:column;gap:1px;}
  .day-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:21px;
  }
  .day-date{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---- Meals grid ---- */
  .meals{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:440px){
    .meals{grid-template-columns:1fr 1fr;}
  }
  .meal{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:11px 12px;
    border-radius:10px;
    background:rgba(0,0,0,0.015);
  }
  .meal-icon{
    width:32px;height:32px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .meal-icon svg{width:17px;height:17px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .meal.desayuno .meal-icon{background:var(--mustard-tint);}
  .meal.desayuno .meal-icon svg{stroke:var(--mustard);}
  .meal.media .meal-icon{background:var(--sage-tint);}
  .meal.media .meal-icon svg{stroke:var(--sage);}
  .meal.almuerzo .meal-icon{background:var(--rust-tint);}
  .meal.almuerzo .meal-icon svg{stroke:var(--rust);}
  .meal.cena .meal-icon{background:var(--dusk-tint);}
  .meal.cena .meal-icon svg{stroke:var(--dusk);}

  .meal-text{min-width:0;}
  .meal-label{
    color:var(--ink-soft);
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:2px;
  }
  .meal-value{
    color:var(--ink);
    font-size:14.5px;
    line-height:1.3;
  }
  .meal-value.empty{
    color:var(--ink-soft);
    font-style:italic;
  }

  /* ---- States ---- */
  .state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .state h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--ink);
    font-size:20px;
    margin:0 0 8px;
  }
  .state code{
    background:var(--paper);
    border:1px solid var(--line);
    padding:2px 6px;
    border-radius:3px;
    font-size:13px;
  }
  .state a{color:var(--sage);}

  footer{
    margin-top:26px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a3 3 0 0 0 6 0V3"/><path d="M9 10v11"/><path d="M18 3c-1.5 1.5-2 3-2 6s.5 4.5 2 6"/><path d="M18 3v18"/></svg>
      </span>
      <span class="brand-name">Cocina semanal</span>
    </div>
    <h1>Menú de la semana</h1>
    <p class="subtitle">Desayuno, media mañana, almuerzo y cena.</p>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Cargando…</span></div>
  </header>

  <main id="app">
    <div class="state"><h2>Cargando el menú…</h2></div>
  </main>

  <footer id="footer" style="display:none">Actualizado desde tu hoja de cálculo · <span id="updatedAt"></span></footer>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — pega aquí el link de tu Google Sheet publicado
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-0io3KEPeid20oEtEDmNwBGnYJHTSOnVsq3V8wUEmOGeMSMe_nfazhJb4HbhOXOjJfQfqbSNlMKbl/pub?output=csv";

const ICONS = {
  desayuno: '<svg viewBox="0 0 24 24"><path d="M4 9h13a3 3 0 0 1 0 6H4z"/><path d="M4 9v6"/><path d="M17 9a4 4 0 0 0 0-6"/><path d="M2 21h17"/></svg>',
  media: '<svg viewBox="0 0 24 24"><path d="M12 6c2-2 5-2 6 0 1.5 2.5 0 6-3 9-1 1-2 1.5-3 1.5s-2-.5-3-1.5c-3-3-4.5-6.5-3-9 1-1.8 3-2 4-1"/><path d="M12 6c0-1.5 1-3 2.5-3.5"/></svg>',
  almuerzo: '<svg viewBox="0 0 24 24"><path d="M7 2v7a2 2 0 0 0 4 0V2"/><path d="M9 9v13"/><path d="M17 2c-1.2 1.2-1.5 2.5-1.5 4.5S15.8 10 17 11c1.2-1 1.5-2.5 1.5-4.5S18.2 3.2 17 2Z"/><path d="M17 11v11"/></svg>',
  cena: '<svg viewBox="0 0 24 24"><path d="M20 15a8 8 0 1 1-9-11.9A7 7 0 0 0 20 15Z"/></svg>'
};

const MEAL_COLUMNS = [
  { key: "Desayuno", label: "Desayuno", cls: "desayuno", icon: ICONS.desayuno },
  { key: "Med/Mañ",  label: "Media mañana", cls: "media", icon: ICONS.media },
  { key: "Almuerzo", label: "Almuerzo", cls: "almuerzo", icon: ICONS.almuerzo },
  { key: "Cena",     label: "Cena", cls: "cena", icon: ICONS.cena }
];

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function parseFecha(str){
  const m = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
}

function isSameDay(a, b){
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function render(rows){
  const app = document.getElementById('app');
  const header = rows[0].map(h => h.trim());
  const body = rows.slice(1);

  const idx = {};
  header.forEach((h, i) => idx[h] = i);

  if(idx['Fecha'] === undefined || idx['Nom_Dia'] === undefined){
    showError("No encuentro las columnas <code>Fecha</code> y <code>Nom_Dia</code> en la hoja. Revisa que los encabezados coincidan.");
    return;
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  app.innerHTML = "";
  body.forEach(r => {
    const fechaStr = (r[idx['Fecha']] || "").trim();
    const fecha = parseFecha(fechaStr);
    const nombreDia = (r[idx['Nom_Dia']] || "").trim();
    if(!nombreDia) return;

    const isToday = !!(fecha && isSameDay(fecha, today));

    const card = document.createElement('div');
    card.className = 'day' + (isToday ? ' today' : '');

    const badge = document.createElement('span');
    badge.className = 'today-badge';
    badge.textContent = 'HOY';
    card.appendChild(badge);

    const headDiv = document.createElement('div');
    headDiv.className = 'day-head';

    const dayBadge = document.createElement('div');
    dayBadge.className = 'day-badge';
    dayBadge.textContent = nombreDia.slice(0, 2);
    headDiv.appendChild(dayBadge);

    const titles = document.createElement('div');
    titles.className = 'day-titles';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'day-name';
    nameSpan.textContent = nombreDia;
    titles.appendChild(nameSpan);
    if(fechaStr){
      const dateSpan = document.createElement('span');
      dateSpan.className = 'day-date';
      dateSpan.textContent = fechaStr;
      titles.appendChild(dateSpan);
    }
    headDiv.appendChild(titles);
    card.appendChild(headDiv);

    const mealsDiv = document.createElement('div');
    mealsDiv.className = 'meals';
    MEAL_COLUMNS.forEach(col => {
      if(idx[col.key] === undefined) return;
      const value = (r[idx[col.key]] || "").trim();

      const item = document.createElement('div');
      item.className = 'meal ' + col.cls;

      const icon = document.createElement('div');
      icon.className = 'meal-icon';
      icon.innerHTML = col.icon;
      item.appendChild(icon);

      const text = document.createElement('div');
      text.className = 'meal-text';
      const label = document.createElement('div');
      label.className = 'meal-label';
      label.textContent = col.label;
      const val = document.createElement('div');
      val.className = 'meal-value' + (value ? '' : ' empty');
      val.textContent = value || 'Sin definir';
      text.appendChild(label);
      text.appendChild(val);
      item.appendChild(text);

      mealsDiv.appendChild(item);
    });
    card.appendChild(mealsDiv);

    app.appendChild(card);
  });

  if(!app.children.length){
    showError("La hoja no tiene filas de menú todavía.");
    return;
  }

  document.getElementById('statusText').textContent = 'Menú actualizado';
  document.querySelector('.dot').classList.remove('err');
  const footer = document.getElementById('footer');
  footer.style.display = 'block';
  document.getElementById('updatedAt').textContent = today.toLocaleString('es-PE', { dateStyle:'medium', timeStyle:'short' });
}

function showError(message){
  document.getElementById('statusText').textContent = 'No se pudo cargar';
  document.querySelector('.dot').classList.add('err');
  document.getElementById('app').innerHTML =
    '<div class="state"><h2>No se pudo cargar el menú</h2><p>' + message + '</p></div>';
}

function loadMenu(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('http') !== 0){
    showError('Todavía no configuraste el enlace de tu hoja. Abre este archivo, busca <code>SHEET_CSV_URL</code> y pega ahí el enlace CSV publicado de tu Google Sheet.');
    return;
  }
  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now())
    .then(res => {
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      if(!rows.length) throw new Error('vacío');
      render(rows);
    })
    .catch(err => {
      showError('Hubo un problema al conectar con la hoja (' + err.message + '). Verifica que esté publicada en la Web como CSV y que el enlace sea correcto.');
    });
}

loadMenu();
</script>
</body>
</html>
