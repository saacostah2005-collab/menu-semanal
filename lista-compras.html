<style>
  /* Misma paleta que el menú, tomada del banner */
  :root{
    --bg:#F3F6F0;
    --surface:#FFFFFF;
    --surface-2:#EEF3EA;
    --ink:#17251C;
    --ink-2:#4F5E54;
    --ink-3:#85928A;
    --line:#E0E8DA;
    --line-strong:#CCD8C5;

    --brand:#1E5B3A;
    --brand-hover:#174A2F;
    --brand-ink:#FFFFFF;
    --brand-soft:#E4F0E6;
    --leaf:#6AB04C;
    --leaf-soft:#EAF5E1;
    --danger:#D44E2C;

    --r-lg:20px;
    --r:14px;
    --shadow-sm:0 1px 2px rgba(18,61,39,.05);
    --shadow:0 1px 2px rgba(18,61,39,.05), 0 10px 28px -10px rgba(18,61,39,.16);

    --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#0C1711;
    --surface:#12211A;
    --surface-2:#182B21;
    --ink:#E8F0E6;
    --ink-2:#A8B8AC;
    --ink-3:#718276;
    --line:#1F3328;
    --line-strong:#2A4234;

    --brand:#2E7A4F;
    --brand-hover:#38895B;
    --brand-ink:#FFFFFF;
    --brand-soft:#163323;
    --leaf:#8BCB5F;
    --leaf-soft:#1A2E1C;
    --danger:#EE7C5C;

    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%; color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 18px;}
  @media (min-width:768px){ .wrap{padding:0 32px;} }
  button{font:inherit; color:inherit; touch-action:manipulation;}
  :focus-visible{outline:2.5px solid var(--leaf); outline-offset:2px; border-radius:10px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .ico{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  /* ---------- Banner ---------- */
  .hero{position:relative; overflow:hidden; height:clamp(190px, 22vw, 340px); background:#123D27; color:#fff;}
  .hero-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:left top; display:block;}
  .hero::after{content:""; position:absolute; inset:auto 0 0 0; height:45%; background:linear-gradient(to top, rgba(10,36,22,.45), rgba(10,36,22,0)); pointer-events:none;}
  .hero-bar{position:absolute; left:0; right:0; bottom:0; z-index:1; padding-bottom:16px; display:flex; align-items:flex-end; justify-content:flex-end; gap:8px;}
  @media (min-width:768px){ .hero-bar{padding-bottom:24px;} }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 18px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; text-decoration:none;
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s var(--ease-out);
  }
  .btn:active:not(:disabled){transform:scale(.96);}
  .btn .ico{width:18px; height:18px;}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink);}
  .btn.light{background:rgba(255,255,255,.95); border-color:transparent; color:#17251C; box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .btn.light .ico{color:#1E5B3A;}
  .btn.glass{background:rgba(8,30,18,.42); border-color:rgba(255,255,255,.22); color:#fff; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2); height:40px; font-size:14px;}
  .btn.icon{width:44px; padding:0;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  @media (hover:hover){
    .btn:hover:not(:disabled){background:var(--surface-2);}
    .btn.primary:hover:not(:disabled){background:var(--brand-hover); border-color:var(--brand-hover);}
    .btn.light:hover:not(:disabled){background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.22);}
    .btn.glass:hover:not(:disabled){background:rgba(8,30,18,.6);}
  }

  /* ---------- Encabezado ---------- */
  .head{padding:28px 0 22px; display:flex; align-items:center; gap:16px;}
  @media (min-width:768px){ .head{padding:40px 0 28px;} }
  .head-ico{width:56px; height:56px; border-radius:18px; background:linear-gradient(135deg, #1E5B3A, #2D7448); color:#B9E58F; display:grid; place-items:center; flex:none; box-shadow:var(--shadow);}
  .head-ico .ico{width:26px; height:26px;}
  .kicker{font-size:13.5px; font-weight:600; color:var(--ink-2); margin:0 0 2px;}
  h1{font-size:clamp(26px, 4vw, 36px); font-weight:800; letter-spacing:-.025em; line-height:1.1; margin:0;}
  .lead{margin:4px 0 0; font-size:15px; color:var(--ink-2);}

  /* ---------- Contenido ---------- */
  .layout{display:grid; gap:16px; align-items:start;}
  @media (min-width:900px){ .layout{grid-template-columns:minmax(0,1fr) 320px; gap:24px;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm);}

  .list-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 12px;}
  .list-title{display:flex; align-items:center; gap:10px;}
  .list-title .mini{width:36px; height:36px; border-radius:11px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center;}
  :root[data-theme="dark"] .list-title .mini{color:var(--leaf);}
  .list-title .mini .ico{width:18px; height:18px;}
  .list-head h2{font-size:18px; font-weight:800; letter-spacing:-.01em; margin:0;}
  .count{font-size:13.5px; font-weight:700; color:var(--brand); background:var(--leaf-soft); padding:5px 10px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  :root[data-theme="dark"] .count{color:var(--leaf);}
  .progress{height:6px; background:var(--surface-2); margin:0 20px 8px; border-radius:6px; overflow:hidden;}
  .progress span{display:block; height:100%; width:0; background:linear-gradient(90deg, var(--brand), var(--leaf)); border-radius:6px; transition:width .35s var(--ease-out);}

  .items{list-style:none; margin:0; padding:6px; display:grid;}
  @media (min-width:640px){ .items{grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:4px;} }
  .item label{
    display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 14px; border-radius:var(--r);
    cursor:pointer; user-select:none; -webkit-user-select:none;
    transition:background-color .15s ease;
  }
  @media (hover:hover){ .item label:hover{background:var(--surface-2);} }
  .item input{position:absolute; opacity:0; pointer-events:none;}
  .check{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--line-strong); flex:none;
    display:grid; place-items:center; background:var(--surface);
    transition:background-color .15s ease, border-color .15s ease, transform .15s var(--ease-out);
  }
  .check .ico{width:14px; height:14px; color:#fff; stroke-width:3; opacity:0; transform:scale(.5); transition:opacity .15s ease, transform .2s var(--ease-out);}
  .item label:active .check{transform:scale(.88);}
  .item input:checked + .check{background:var(--leaf); border-color:var(--leaf);}
  .item input:checked + .check .ico{opacity:1; transform:scale(1);}
  .item input:focus-visible + .check{outline:2.5px solid var(--leaf); outline-offset:2px;}
  .item-name{font-size:15.5px; font-weight:600; overflow-wrap:anywhere; transition:color .15s ease;}
  .item input:checked ~ .item-name{color:var(--ink-3); font-weight:500; text-decoration:line-through; text-decoration-color:var(--line-strong);}

  .list-foot{display:flex; justify-content:flex-end; padding:2px 10px 10px;}

  /* Panel de acciones */
  .side{padding:20px; display:grid; gap:10px;}
  @media (min-width:900px){ .side-wrap{position:sticky; top:20px;} }
  .side-top{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .side-top .mini{width:40px; height:40px; border-radius:12px; background:#FDF0D9; color:#DB8E17; display:grid; place-items:center; flex:none;}
  :root[data-theme="dark"] .side-top .mini{background:#2E2513; color:#F0B54D;}
  .side h2{font-size:16px; font-weight:800; margin:0;}
  .side p{margin:0 0 6px; font-size:14px; color:var(--ink-2);}
  .side .btn{width:100%;}
  .status{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--ink-2); min-height:21px; margin:2px 0 0;}
  .status .ico{width:16px; height:16px;}
  .status.ok{color:var(--brand);}
  :root[data-theme="dark"] .status.ok{color:var(--leaf);}
  .status.err{color:var(--danger);}

  /* Por día */
  .by-day{margin-top:44px;}
  .sec-title{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .sec-ico{width:44px; height:44px; border-radius:14px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; flex:none;}
  :root[data-theme="dark"] .sec-ico{color:var(--leaf);}
  .sec-ico .ico{width:22px; height:22px;}
  .sec-title h2{font-size:clamp(20px, 2.6vw, 24px); font-weight:800; letter-spacing:-.02em; margin:0; line-height:1.2;}
  .sec-title p{margin:2px 0 0; color:var(--ink-2); font-size:14px;}
  .days{display:grid; gap:12px;}
  @media (min-width:640px){ .days{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media (min-width:1000px){ .days{grid-template-columns:repeat(3, minmax(0,1fr));} }
  .day{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px 18px; min-width:0; box-shadow:var(--shadow-sm);}
  .day-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .day-top .mini{width:34px; height:34px; border-radius:10px; background:#FCE7E0; color:#D44E2C; display:grid; place-items:center; flex:none;}
  :root[data-theme="dark"] .day-top .mini{background:#33201A; color:#EE7C5C;}
  .day-top .mini .ico{width:17px; height:17px;}
  .day-dow{font-size:12.5px; font-weight:600; color:var(--ink-3); margin:0; line-height:1.2;}
  .day-dish{font-size:16px; font-weight:800; line-height:1.25; margin:0; overflow-wrap:anywhere;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none;}
  .chips li{font-size:13px; font-weight:600; padding:5px 10px; border-radius:999px; background:var(--leaf-soft); color:var(--brand);}
  :root[data-theme="dark"] .chips li{color:var(--leaf);}
  .day-empty{font-size:14px; color:var(--ink-3); margin:0;}

  .state{text-align:center; padding:44px 24px; color:var(--ink-2); border:1px dashed var(--line-strong); border-radius:var(--r-lg); background:var(--surface);}
  .state .sec-ico{margin:0 auto 14px;}
  .state h2{color:var(--ink); font-size:20px; font-weight:800; margin:0 0 6px;}
  .state p{margin:0 auto 18px; max-width:420px;}

  .footer{margin-top:56px; padding:22px 0 40px; border-top:1px solid var(--line); font-size:13.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px;}
  .footer .ico{width:16px; height:16px; color:var(--leaf);}
</style>
</head>
<body>

<!-- Iconos (estilo Lucide, licencia ISC) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>

  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/></symbol>

<header class="hero">
  <img class="hero-img" src="banner.jpg" width="1432" height="459" fetchpriority="high"
       alt="Menu Smart — Tu menú inteligente. Planifica tus comidas. Come mejor. Vive saludable.">
  <div class="hero-bar wrap">
    <button class="btn glass icon" id="themeToggle" type="button">
      <svg class="ico" aria-hidden="true"><use id="themeIcon" href="#i-moon"/></svg>
      <span class="sr-only" id="themeLabel">Modo oscuro</span>
    </button>
    <a class="btn light" href="./">
      <svg class="ico" aria-hidden="true"><use href="#i-left"/></svg>
      <span>Volver al menú</span>
    </a>
  </div>
</header>

<main class="wrap">
  <section class="head">
    <span class="head-ico" aria-hidden="true"><svg class="ico"><use href="#i-basket"/></svg></span>
    <div>
      <p class="kicker" id="weekRangeLabel">&nbsp;</p>
      <h1>Lista de compras</h1>
      <p class="lead" id="lead">Cargando…</p>
    </div>
  </section>

  <div id="content">
    <div class="layout">
      <section class="card" aria-labelledby="listTitle">
        <div class="list-head">
          <div class="list-title">
            <span class="mini" aria-hidden="true"><svg class="ico"><use href="#i-list"/></svg></span>
            <h2 id="listTitle">Ingredientes</h2>
          </div>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <ul class="items" id="items"></ul>
        <div class="list-foot">
          <button class="btn ghost" id="btnReset" type="button" hidden>
            <svg class="ico" aria-hidden="true"><use href="#i-rotate"/></svg><span>Desmarcar todo</span>
          </button>
        </div>
      </section>

      <div class="side-wrap">
        <aside class="card side" aria-label="Acciones">
          <div class="side-top">
            <span class="mini" aria-hidden="true"><svg class="ico"><use href="#i-cart"/></svg></span>
            <h2>Para ir al mercado</h2>
          </div>
          <p>Copia lo que te falta y pégalo en WhatsApp o en tus notas.</p>
          <button class="btn primary" id="btnCopy" type="button">
            <svg class="ico" aria-hidden="true"><use href="#i-copy"/></svg>
            <span>Copiar lo que falta</span>
          </button>
          <button class="btn" id="btnSave" type="button">
            <svg class="ico" aria-hidden="true"><use href="#i-cloud"/></svg>
            <span>Guardar en historial</span>
          </button>
          <p class="status" id="actionStatus" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </div>

    <section class="by-day" aria-labelledby="byDayTitle">
      <div class="sec-title">
        <span class="sec-ico" aria-hidden="true"><svg class="ico"><use href="#i-calendar"/></svg></span>
        <div>
          <h2 id="byDayTitle">Por día</h2>
          <p>De qué plato sale cada ingrediente.</p>
        </div>
      </div>
      <div class="days" id="daysContainer"></div>
    </section>
  </div>

  <footer class="footer"><svg class="ico" aria-hidden="true"><use href="#i-leaf"/></svg>Menu Smart · Planifica tus comidas, come mejor.</footer>
</main>

<script>
/* ============================================================
   Diccionario de ingredientes típicos por plato.
   Se busca por coincidencia de palabras clave dentro del texto
   del plato (insensible a mayúsculas/acentos). Si ningún plato
   coincide, se usa un respaldo simple (separar por / , +).
   ============================================================ */
const DISH_INGREDIENTS = [
  { keys: ["pollo horno", "pollo al horno"], items: ["Pollo", "papa", "zanahoria", "cebolla", "ajo", "comino", "aceite de oliva", "sal", "pimienta", "orégano"] },
  { keys: ["filete pollo", "filete de pollo"], items: ["Filete de pollo", "papa", "limón", "ajo", "sal", "pimienta", "aceite"] },
  { keys: ["pollo"], items: ["Pollo", "cebolla", "ajo", "sal", "pimienta", "aceite"] },
  { keys: ["arroz con pollo"], items: ["Pollo", "arroz", "arvejas", "zanahoria", "pimiento", "ajo", "cebolla", "culantro", "cerveza", "aceite", "sal", "pimienta"] },
  { keys: ["lomo saltado"], items: ["Carne de res", "tomate", "cebolla", "ají amarillo", "sillao", "vinagre", "papas fritas", "arroz", "sal", "pimienta"] },
  { keys: ["estofado"], items: ["Carne o pollo", "papa", "arveja", "zanahoria", "cebolla", "tomate", "ajo", "sal", "pimienta", "aceite"] },

  { keys: ["pescado"], items: ["Pescado", "papa", "limón", "sal", "aceite"] },
  { keys: ["pavita"], items: ["Pavita (pechuga de pavo)", "camote", "sal", "pimienta", "aceite"] },
  { keys: ["camote"], items: ["Camote"] },

  { keys: ["sopo verdura", "sopa de verdura", "sopa criolla"], items: ["Fideo cabello de ángel", "papa", "verduras variadas (zanahoria, apio, zapallo)", "huevo", "leche", "sal", "pimienta"] },
  { keys: ["tallarines verdes"], items: ["Tallarines", "espinaca", "albahaca", "ajo", "leche evaporada", "queso parmesano", "aceite de oliva", "sal", "pimienta"] },
  { keys: ["pachamanca"], items: ["Carne de res, cerdo y pollo", "papa", "camote", "habas", "maíz", "huacatay", "ají panca", "sal"] },
  { keys: ["choclo"], items: ["Choclo"] },
  { keys: ["queso"], items: ["Queso fresco"] },
  { keys: ["atun", "atún"], items: ["Atún en lata", "cebolla", "limón", "sal"] },
  { keys: ["pan"], items: ["Pan"] },
  { keys: ["mandarina", "manzana", "fruta"], items: [] } // la fruta se muestra tal cual, sin expandir
];

const SVGNS = 'http://www.w3.org/2000/svg';

function normalize(s){
  return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function splitRaw(text){
  if(!text) return [];
  return text.split(/[\/,+]|(?:\by\b)/i).map(s => s.trim()).filter(Boolean);
}

/* Expande un texto de plato (p.ej. "Filete Pollo / Papa") en una
   lista de ingredientes, combinando coincidencias del diccionario
   para cada componente y usando el texto tal cual si no hay match. */
function expandDish(text){
  const parts = splitRaw(text);
  if(!parts.length) return [];
  const result = [];
  const seen = new Set();

  parts.forEach(part => {
    const normPart = normalize(part);
    let matched = null;
    for(const entry of DISH_INGREDIENTS){
      if(entry.keys.some(k => normPart.includes(normalize(k)))){
        matched = entry;
        break;
      }
    }
    const add = item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); result.push(item); }
    };
    if(matched && matched.items.length) matched.items.forEach(add);
    else add(part);
  });

  return result;
}

const DAY_NAMES = { lunes:"Lunes", martes:"Martes", miercoles:"Miércoles", jueves:"Jueves", viernes:"Viernes", sabado:"Sábado", domingo:"Domingo" };
function displayDay(name){ return DAY_NAMES[normalize(name)] || name; }

function isFree(text){ return !text || normalize(text) === 'libre'; }

function dayIngredients(day){
  const out = [];
  const seen = new Set();
  [day.almuerzo, day.cena, day.desayuno, day.media].forEach(text => {
    if(isFree(text)) return;
    expandDish(text).forEach(item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); out.push(item); }
    });
  });
  return out;
}

function getAllIngredientsFlat(data){
  const seen = new Set();
  const out = [];
  data.days.forEach(day => {
    dayIngredients(day).forEach(item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); out.push(capitalize(item)); }
    });
  });
  return out.sort((a,b) => a.localeCompare(b, 'es'));
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function icon(id){
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'ico');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(SVGNS, 'use');
  use.setAttribute('href', '#' + id);
  svg.appendChild(use);
  return svg;
}

function setStatus(text, state){
  const s = document.getElementById('actionStatus');
  s.innerHTML = '';
  if(state === 'ok') s.appendChild(icon('i-check'));
  if(state === 'err') s.appendChild(icon('i-alert'));
  s.append(text);
  s.className = 'status' + (state ? ' ' + state : '');
}

/* ---------- tarjetas por día ---------- */
function buildDayCard(day){
  // Plato principal = Almuerzo; si está "Libre" o vacío, usa la Cena
  const main = !isFree(day.almuerzo) ? day.almuerzo : (!isFree(day.cena) ? day.cena : '');
  const items = dayIngredients(day);

  const card = el('article', 'day');
  const top = el('div', 'day-top');
  const mini = el('span', 'mini'); mini.appendChild(icon('i-utensils'));
  const t = el('div');
  t.appendChild(el('p', 'day-dow', displayDay(day.nombreDia)));
  t.appendChild(el('h3', 'day-dish', main ? main.trim() : 'Día libre'));
  top.append(mini, t);
  card.appendChild(top);
  if(items.length){
    const ul = el('ul', 'chips');
    items.forEach(i => ul.appendChild(el('li', '', capitalize(i))));
    card.appendChild(ul);
  } else {
    card.appendChild(el('p', 'day-empty', 'Sin ingredientes para este día.'));
  }
  return card;
}

/* ---------- lista con casillas (se recuerda por semana) ---------- */
let CHECKED = new Set();
let STORE_KEY = '';

function saveChecked(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(CHECKED))); }catch(e){}
}

function updateProgress(total){
  const done = CHECKED.size;
  document.getElementById('count').textContent = done + ' de ' + total;
  document.getElementById('progressBar').style.width = (total ? (done / total * 100) : 0) + '%';
  document.getElementById('btnReset').hidden = done === 0;
}

function buildChecklist(list){
  const ul = document.getElementById('items');
  ul.innerHTML = '';
  list.forEach((name, i) => {
    const key = normalize(name);
    const li = el('li', 'item');
    const label = el('label');
    const input = el('input');
    input.type = 'checkbox';
    input.id = 'it-' + i;
    input.checked = CHECKED.has(key);
    input.addEventListener('change', () => {
      if(input.checked) CHECKED.add(key); else CHECKED.delete(key);
      saveChecked();
      updateProgress(list.length);
    });
    const box = el('span', 'check');
    box.setAttribute('aria-hidden', 'true');
    box.appendChild(icon('i-check'));
    label.append(input, box, el('span', 'item-name', name));
    li.appendChild(label);
    ul.appendChild(li);
  });
  updateProgress(list.length);
}

function init(){
  let data = null;
  try{
    const raw = localStorage.getItem('menuSmartShoppingWeek');
    if(raw) data = JSON.parse(raw);
  }catch(e){}

  if(!data || !data.days || !data.days.length){
    document.getElementById('lead').textContent = 'Todavía no hay una semana seleccionada.';
    document.getElementById('content').innerHTML =
      '<div class="state"><span class="sec-ico"><svg class="ico" aria-hidden="true"><use href="#i-cart"/></svg></span>' +
      '<h2>No hay datos del menú</h2><p>Abre tu menú y toca «Lista de compras» para traer los ingredientes de esa semana.</p>' +
      '<a class="btn primary" href="./">Ir al menú</a></div>';
    return;
  }

  const list = getAllIngredientsFlat(data);
  const activeDays = data.days.filter(d => dayIngredients(d).length).length;

  document.getElementById('weekRangeLabel').textContent = 'Semana del ' + data.weekLabel;
  document.getElementById('lead').textContent =
    list.length + ' ingredientes para ' + activeDays + (activeDays === 1 ? ' día' : ' días') + ' de comidas.';

  STORE_KEY = 'menuSmartChecked:' + (data.monday || '');
  try{ CHECKED = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); }catch(e){ CHECKED = new Set(); }
  // quita marcas de ingredientes que ya no están en la lista
  const valid = new Set(list.map(normalize));
  CHECKED.forEach(k => { if(!valid.has(k)) CHECKED.delete(k); });

  buildChecklist(list);

  const container = document.getElementById('daysContainer');
  container.innerHTML = '';
  data.days.forEach(day => container.appendChild(buildDayCard(day)));

  document.getElementById('btnReset').addEventListener('click', function(){
    CHECKED.clear();
    saveChecked();
    buildChecklist(list);
  });

  document.getElementById('btnCopy').addEventListener('click', function(){
    const pending = list.filter(i => !CHECKED.has(normalize(i)));
    const toCopy = pending.length ? pending : list;
    const text = 'Lista de compras · ' + data.weekLabel + '\n' + toCopy.map(i => '- ' + i).join('\n');
    navigator.clipboard.writeText(text).then(function(){
      setStatus(pending.length
        ? 'Copiados ' + pending.length + ' ingredientes pendientes.'
        : 'Ya marcaste todo; se copió la lista completa.', 'ok');
    }).catch(function(){
      setStatus('No se pudo copiar automáticamente.', 'err');
    });
  });

  document.getElementById('btnSave').addEventListener('click', function(){
    const saveBtn = document.getElementById('btnSave');
    const url = data.historialScriptUrl;

    if(!url || url.indexOf('http') !== 0){
      setStatus('Falta configurar el enlace de Google Apps Script.', 'err');
      return;
    }

    const payload = {
      fechaGenerado: new Date().toISOString(),
      semanaInicio: data.monday,
      semanaFin: data.sunday,
      ingredientes: list.join(', ')
    };

    saveBtn.disabled = true;
    setStatus('Guardando…');

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(resData => {
      if(resData && resData.ok){
        setStatus('Guardado en tu hoja Historial_Compras.', 'ok');
      } else {
        throw new Error((resData && resData.error) || 'respuesta inesperada');
      }
    })
    .catch(err => {
      setStatus('No se pudo guardar (' + err.message + ').', 'err');
    })
    .finally(() => { saveBtn.disabled = false; });
  });
}

/* ---------- tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const label = theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  document.getElementById('themeLabel').textContent = label;
  document.getElementById('themeToggle').title = label;
  document.getElementById('themeIcon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  try{ localStorage.setItem('menuSemanalTheme', theme); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('menuSemanalTheme'); }catch(e){}
  const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (preferDark ? 'dark' : 'light'));
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

init();
</script>
