<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --surface-2:#EFECE4;
    --ink:#1D1B16;
    --ink-2:#5E5A50;
    --ink-3:#8C877B;
    --line:#E5E1D7;
    --line-strong:#D4CFC2;

    --accent:#1F5C3F;
    --accent-hover:#174A32;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7EFE6;
    --accent-line:#BFD5C4;
    --danger:#B5523A;

    --r-lg:18px;
    --r:12px;
    --shadow:0 1px 1px rgba(40,30,10,.03), 0 2px 6px rgba(40,30,10,.04), 0 12px 32px -12px rgba(40,30,10,.10);

    --sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#121311;
    --surface:#1A1B18;
    --surface-2:#22231F;
    --ink:#EEECE6;
    --ink-2:#AAA699;
    --ink-3:#7A776D;
    --line:#2A2B26;
    --line-strong:#383931;

    --accent:#6DBB8F;
    --accent-hover:#84CBA2;
    --accent-ink:#0C1A12;
    --accent-soft:#17241B;
    --accent-line:#2B4535;
    --danger:#E0846B;

    --shadow:0 1px 1px rgba(0,0,0,.25), 0 12px 32px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%; color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}
  @media (min-width:768px){ .wrap{padding:0 36px;} }
  button{font:inherit; color:inherit; touch-action:manipulation;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  /* ---------- Barra superior ---------- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid transparent; transition:border-color .2s ease;

  .topbar.scrolled{border-bottom-color:var(--line);}
  .topbar .wrap{height:64px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; flex:none;}
  .brand-mark svg{width:17px; height:17px; stroke:var(--accent-ink); fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .brand-name{font-family:var(--serif); font-weight:500; font-size:21px; letter-spacing:-.01em;}
  .top-actions{display:flex; align-items:center; gap:8px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 18px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);

    transition:background-color .15s ease, border-color .15s ease, transform .12s var(--ease-out);
  }
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.icon{width:42px; height:42px; padding:0;}
  .btn.sm{height:42px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  @media (hover:hover){

    .btn.primary:hover:not(:disabled){background:var(--accent-hover); border-color:var(--accent-hover);}

  .kicker{font-size:14px; font-weight:500; color:var(--ink-2); margin:0 0 14px;}

  /* ---------- Contenido ---------- */
  .layout{display:grid; gap:20px; align-items:start;}
  @media (min-width:900px){ .layout{grid-template-columns:minmax(0,1fr) 320px; gap:32px;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);}

  .list-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 14px;}

  .items{list-style:none; margin:0; padding:6px; display:grid;}
  @media (min-width:640px){ .items{grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:4px;} }
  .item label{
    display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 14px; border-radius:var(--r);
    cursor:pointer; user-select:none; -webkit-user-select:none;

  @media (hover:hover){ .item label:hover{background:var(--surface-2);} }
  .item input{position:absolute; opacity:0; pointer-events:none;}
  .check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-strong); flex:none;
    display:grid; place-items:center; background:var(--surface);
    transition:background-color .15s ease, border-color .15s ease, transform .15s var(--ease-out);
  }
  .check svg{width:14px; height:14px; stroke:var(--accent-ink); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; opacity:0; transform:scale(.6); transition:opacity .15s ease, transform .2s var(--ease-out);}
  .item label:active .check{transform:scale(.9);}
  .item input:checked + .check{background:var(--accent); border-color:var(--accent);}
  .item input:checked + .check svg{opacity:1; transform:scale(1);}
  .item input:focus-visible + .check{outline:2px solid var(--accent); outline-offset:2px;}
  .item-name{font-size:15.5px; overflow-wrap:anywhere; transition:color .15s ease;}
  .item input:checked ~ .item-name{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong);}

  .list-foot{display:flex; justify-content:flex-end; padding:4px 12px 12px;}
  .list-foot .btn{height:40px; font-size:14px; color:var(--ink-2);}

  /* Panel de acciones */
  .side{padding:20px; display:grid; gap:10px;}
  @media (min-width:900px){ .side-wrap{position:sticky; top:84px;} }
  .side h2{font-size:15px; font-weight:600; margin:0 0 4px;}
  .side p{margin:0 0 6px; font-size:14px; color:var(--ink-2);}
  .side .btn{width:100%;}
  .status{font-size:14px; color:var(--ink-2); min-height:21px; margin:2px 0 0;}
  .status.ok{color:var(--accent);}
  .status.err{color:var(--danger);}

  /* Por día */
  .by-day{margin-top:56px; padding-top:40px; border-top:1px solid var(--line);}
  .by-day h2{font-family:var(--serif); font-weight:400; font-size:clamp(28px, 3.6vw, 36px); letter-spacing:-.02em; margin:0 0 6px;}
  .by-day > p{margin:0 0 20px; color:var(--ink-2); font-size:15px;}
  .days{display:grid; gap:12px;}
  @media (min-width:640px){ .days{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media (min-width:1000px){ .days{grid-template-columns:repeat(3, minmax(0,1fr));} }
  .day{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 20px 20px; min-width:0;}
  .day-dow{font-size:13px; font-weight:500; color:var(--ink-3); margin:0 0 4px;}
  .day-dish{font-family:var(--serif); font-size:21px; line-height:1.2; letter-spacing:-.01em; margin:0 0 14px; overflow-wrap:anywhere;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none;}
  .chips li{font-size:13px; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2);}
  .day-empty{font-size:14px; color:var(--ink-3); margin:0;}

  .state{text-align:center; padding:56px 24px; color:var(--ink-2); border:1px dashed var(--line-strong); border-radius:var(--r-lg); background:var(--surface);}
  .state h2{font-family:var(--serif); font-weight:400; color:var(--ink); font-size:26px; margin:0 0 8px;}
  .state p{margin:0 auto 20px; max-width:420px;}

  .footer{margin-top:64px; padding:22px 0 44px; border-top:1px solid var(--line); font-size:13.5px; color:var(--ink-3);}
</style>

<script>
/* ============================================================
   Diccionario de ingredientes típicos por plato.
   Se busca por coincidencia de palabras clave dentro del texto
   del plato (insensible a mayúsculas/acentos). Si ningún plato
   coincide, se usa un respaldo simple (separar por / , +).
   ============================================================ */
const DISH_INGREDIENTS = [
  { keys: ["pollo horno", "pollo al horno"], items: ["Pollo", "papa", "zanahoria", "cebolla", "ajo", "comino", "aceite de oliva", "sal", "pimienta", "orégano"] },
  { keys: ["filete pollo", "filete de pollo"], items: ["Filete de pollo", "papa", "limón", "ajo", "sal", "pimienta", "aceite"] },
  { keys: ["pollo"], items: ["Pollo", "cebolla", "ajo", "sal", "pimienta", "aceite"] },
  { keys: ["arroz con pollo"], items: ["Pollo", "arroz", "arvejas", "zanahoria", "pimiento", "ajo", "cebolla", "culantro", "cerveza", "aceite", "sal", "pimienta"] },
  { keys: ["lomo saltado"], items: ["Carne de res", "tomate", "cebolla", "ají amarillo", "sillao", "vinagre", "papas fritas", "arroz", "sal", "pimienta"] },
  { keys: ["estofado"], items: ["Carne o pollo", "papa", "arveja", "zanahoria", "cebolla", "tomate", "ajo", "sal", "pimienta", "aceite"] },
  { keys: ["pescado frito"], items: ["Pescado", "harina", "huevo", "ajo", "limón", "sal", "pimienta", "aceite", "ensalada (lechuga, tomate, cebolla)"] },
  { keys: ["pescado"], items: ["Pescado", "papa", "limón", "sal", "aceite"] },
  { keys: ["pavita"], items: ["Pavita (pechuga de pavo)", "camote", "sal", "pimienta", "aceite"] },
  { keys: ["camote"], items: ["Camote"] },
  { keys: ["oyuco", "olluco"], items: ["Olluco", "carne o charqui", "cebolla", "ajo", "ají amarillo", "culantro", "sal", "aceite"] },
  { keys: ["alverja", "arveja"], items: ["Arveja", "cebolla", "ajo", "zanahoria", "sal", "aceite"] },
  { keys: ["ensalada"], items: ["Lechuga", "tomate", "cebolla", "sal", "aceite", "limón"] },
  { keys: ["huevo revuelto", "huevo rev"], items: ["Huevo", "cebolla", "tomate", "sal", "aceite"] },
  { keys: ["huevo sanc", "sancochado"], items: ["Huevo"] },
  { keys: ["huevo frito"], items: ["Huevo", "aceite", "sal"] },
  { keys: ["tortilla"], items: ["Huevo", "cebolla", "sal", "aceite"] },
  { keys: ["sopo verdura", "sopa de verdura", "sopa criolla"], items: ["Fideo cabello de ángel", "papa", "verduras variadas (zanahoria, apio, zapallo)", "huevo", "leche", "sal", "pimienta"] },
  { keys: ["tallarines verdes"], items: ["Tallarines", "espinaca", "albahaca", "ajo", "leche evaporada", "queso parmesano", "aceite de oliva", "sal", "pimienta"] },
  { keys: ["pachamanca"], items: ["Carne de res, cerdo y pollo", "papa", "camote", "habas", "maíz", "huacatay", "ají panca", "sal"] },
  { keys: ["choclo"], items: ["Choclo"] },
  { keys: ["queso"], items: ["Queso fresco"] },
  { keys: ["atun", "atún"], items: ["Atún en lata", "cebolla", "limón", "sal"] },
  { keys: ["pan"], items: ["Pan"] },
  { keys: ["mandarina", "manzana", "fruta"], items: [] } // la fruta se muestra tal cual, sin expandir
];

function normalize(s){
  return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function splitRaw(text){
  if(!text) return [];
  return text.split(/[\/,+]|(?:\by\b)/i).map(s => s.trim()).filter(Boolean);
}

/* Expande un texto de plato (p.ej. "Filete Pollo / Papa") en una
   lista de ingredientes, combinando coincidencias del diccionario
   para cada componente y usando el texto tal cual si no hay match. */
function expandDish(text){
  const parts = splitRaw(text);
  if(!parts.length) return [];
  const result = [];
  const seen = new Set();

  parts.forEach(part => {
    const normPart = normalize(part);
    let matched = null;
    for(const entry of DISH_INGREDIENTS){
      if(entry.keys.some(k => normPart.includes(normalize(k)))){
        matched = entry;
        break;
      }
    }
    const add = item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); result.push(item); }
    };
    if(matched && matched.items.length) matched.items.forEach(add);
    else add(part);
  });

  return result;
}

const DAY_NAMES = { lunes:"Lunes", martes:"Martes", miercoles:"Miércoles", jueves:"Jueves", viernes:"Viernes", sabado:"Sábado", domingo:"Domingo" };
function displayDay(name){ return DAY_NAMES[normalize(name)] || name; }

function isFree(text){ return !text || normalize(text) === 'libre'; }

function dayIngredients(day){
  const out = [];
  const seen = new Set();
  [day.almuerzo, day.cena, day.desayuno, day.media].forEach(text => {
    if(isFree(text)) return;
    expandDish(text).forEach(item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); out.push(item); }
    });
  });
  return out;
}

function getAllIngredientsFlat(data){
  const seen = new Set();
  const out = [];
  data.days.forEach(day => {
    dayIngredients(day).forEach(item => {
      const key = normalize(item);
      if(!seen.has(key)){ seen.add(key); out.push(capitalize(item)); }
    });
  });
  return out.sort((a,b) => a.localeCompare(b, 'es'));
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function setStatus(text, state){
  const s = document.getElementById('actionStatus');
  s.textContent = text;
  s.className = 'status' + (state ? ' ' + state : '');
}

/* ---------- tarjetas por día ---------- */
function buildDayCard(day){
  // Plato principal = Almuerzo; si está "Libre" o vacío, usa la Cena
  const main = !isFree(day.almuerzo) ? day.almuerzo : (!isFree(day.cena) ? day.cena : '');
  const items = dayIngredients(day);

  const card = el('article', 'day');
  card.appendChild(el('p', 'day-dow', displayDay(day.nombreDia)));
  card.appendChild(el('h3', 'day-dish', main ? main.trim() : 'Día libre'));
  if(items.length){
    const ul = el('ul', 'chips');
    items.forEach(i => ul.appendChild(el('li', '', capitalize(i))));
    card.appendChild(ul);
  } else {
    card.appendChild(el('p', 'day-empty', 'Sin ingredientes para este día.'));
  }
  return card;
}

/* ---------- lista con casillas (se recuerda por semana) ---------- */
let CHECKED = new Set();
let STORE_KEY = '';

function saveChecked(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(CHECKED))); }catch(e){}
}

function updateProgress(total){
  const done = CHECKED.size;
  document.getElementById('count').textContent = done + ' de ' + total;
  document.getElementById('progressBar').style.width = (total ? (done / total * 100) : 0) + '%';
  document.getElementById('btnReset').hidden = done === 0;
}

function buildChecklist(list){
  const ul = document.getElementById('items');
  ul.innerHTML = '';
  list.forEach((name, i) => {
    const key = normalize(name);
    const li = el('li', 'item');
    const label = el('label');
    const input = el('input');
    input.type = 'checkbox';
    input.id = 'it-' + i;
    input.checked = CHECKED.has(key);
    input.addEventListener('change', () => {
      if(input.checked) CHECKED.add(key); else CHECKED.delete(key);
      saveChecked();
      updateProgress(list.length);
    });
    const box = el('span', 'check');
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    label.append(input, box, el('span', 'item-name', name));
    li.appendChild(label);
    ul.appendChild(li);
  });
  updateProgress(list.length);
}

function init(){
  let data = null;
  try{
    const raw = localStorage.getItem('menuSmartShoppingWeek');
    if(raw) data = JSON.parse(raw);
  }catch(e){}

  if(!data || !data.days || !data.days.length){
    document.getElementById('lead').textContent = 'Todavía no hay una semana seleccionada.';
    document.getElementById('content').innerHTML =
      '<div class="state"><h2>No hay datos del menú</h2><p>Abre tu menú y toca «Lista de compras» para traer los ingredientes de esa semana.</p><a class="btn primary" href="./">Ir al menú</a></div>';
    return;
  }

  const list = getAllIngredientsFlat(data);
  const activeDays = data.days.filter(d => dayIngredients(d).length).length;

  document.getElementById('weekRangeLabel').textContent = 'Semana del ' + data.weekLabel;
  document.getElementById('lead').textContent =
    list.length + ' ingredientes para ' + activeDays + (activeDays === 1 ? ' día' : ' días') + ' de comidas.';

  STORE_KEY = 'menuSmartChecked:' + (data.monday || '');
  try{ CHECKED = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); }catch(e){ CHECKED = new Set(); }
  // quita marcas de ingredientes que ya no están en la lista
  const valid = new Set(list.map(normalize));
  CHECKED.forEach(k => { if(!valid.has(k)) CHECKED.delete(k); });

  buildChecklist(list);

  const container = document.getElementById('daysContainer');
  container.innerHTML = '';
  data.days.forEach(day => container.appendChild(buildDayCard(day)));

  document.getElementById('btnReset').addEventListener('click', function(){
    CHECKED.clear();
    saveChecked();
    buildChecklist(list);
  });

  document.getElementById('btnCopy').addEventListener('click', function(){
    const pending = list.filter(i => !CHECKED.has(normalize(i)));
    const toCopy = pending.length ? pending : list;
    const text = 'Lista de compras · ' + data.weekLabel + '\n' + toCopy.map(i => '- ' + i).join('\n');
    navigator.clipboard.writeText(text).then(function(){
      setStatus(pending.length
        ? 'Copiados ' + pending.length + ' ingredientes pendientes.'
        : 'Ya marcaste todo; se copió la lista completa.', 'ok');
    }).catch(function(){
      setStatus('No se pudo copiar automáticamente.', 'err');
    });
  });

  document.getElementById('btnSave').addEventListener('click', function(){
    const saveBtn = document.getElementById('btnSave');
    const url = data.historialScriptUrl;

    if(!url || url.indexOf('http') !== 0){
      setStatus('Falta configurar el enlace de Google Apps Script.', 'err');
      return;
    }

    const payload = {
      fechaGenerado: new Date().toISOString(),
      semanaInicio: data.monday,
      semanaFin: data.sunday,
      ingredientes: list.join(', ')
    };

    saveBtn.disabled = true;
    setStatus('Guardando…');

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(resData => {
      if(resData && resData.ok){
        setStatus('Guardado en tu hoja Historial_Compras.', 'ok');
      } else {
        throw new Error((resData && resData.error) || 'respuesta inesperada');
      }
    })
    .catch(err => {
      setStatus('No se pudo guardar (' + err.message + ').', 'err');
    })
    .finally(() => { saveBtn.disabled = false; });
  });
}

/* ---------- tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const label = theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  document.getElementById('themeLabel').textContent = label;
  document.getElementById('themeToggle').title = label;
  document.getElementById('themeIcon').innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  try{ localStorage.setItem('menuSemanalTheme', theme); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('menuSemanalTheme'); }catch(e){}
  const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (preferDark ? 'dark' : 'light'));
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

(function(){
  const bar = document.getElementById('topbar');
  const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 4);
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
})();

init();
</script>
